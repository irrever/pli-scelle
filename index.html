<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pli Scellé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#10233A;--ink-2:#33475C;--muted:#5B6B7D;--line:#D3DAE2;--line-2:#E3E8EE;--accent:#0B6B5C;--on-accent:#FFFFFF;--accent-soft:#DDEFEA;--warn:#8A5200;--warn-soft:#FBEFD9;--danger:#B3261E;--danger-soft:#F9E3E1;--id-bg:#10233A;--id-ink:#E6EDF4;--id-muted:#9FB0C3;--id-accent:#9FD8C9;--shadow:0 1px 2px rgba(16,35,58,.06),0 6px 18px rgba(16,35,58,.06);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1A26;--surface:#15263A;--surface-2:#1A2E44;--ink:#E6EDF4;--ink-2:#B9C6D4;--muted:#93A3B5;--line:#2A3D52;--line-2:#22364C;--accent:#7FD8C2;--on-accent:#0E1A26;--accent-soft:#17383A;--warn:#F0B45A;--warn-soft:#3A2C12;--danger:#FF8A80;--danger-soft:#3D1F1D;--id-bg:#0A1522;--id-ink:#E6EDF4;--id-muted:#93A3B5;--id-accent:#7FD8C2;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A26;--surface:#15263A;--surface-2:#1A2E44;--ink:#E6EDF4;--ink-2:#B9C6D4;--muted:#93A3B5;--line:#2A3D52;--line-2:#22364C;--accent:#7FD8C2;--on-accent:#0E1A26;--accent-soft:#17383A;--warn:#F0B45A;--warn-soft:#3A2C12;--danger:#FF8A80;--danger-soft:#3D1F1D;--id-bg:#0A1522;--id-ink:#E6EDF4;--id-muted:#93A3B5;--id-accent:#7FD8C2;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:460px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding:0 0 16px;animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.spinner{animation:none}}
h1{margin:0;font:600 26px/1.2 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:600 17px/1.3 "Bricolage Grotesque",system-ui,sans-serif}
p{margin:0}
.lead{color:var(--muted);font-size:15px}
.hint{color:var(--muted);font-size:13px;line-height:1.45}
.center{text-align:center;align-items:center}
.center-col{align-items:center;text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-title{font-weight:600;font-size:16px}
.row-sub{color:var(--muted);font-size:13px}
.section-title{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.code{font:600 34px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;color:var(--ink)}
.code-sm{font:600 15px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em}
.code-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
.ico{width:20px;height:20px;flex:none}
/* barre du haut */
.topbar{position:relative;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px 8px 8px;background:var(--bg)}
.topbar-title{flex:1;min-width:0;font:600 17px/1.2 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.bare{padding-left:0}
.topbar-right{display:flex;align-items:center;gap:4px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface)}
.iconbtn .ico{width:22px;height:22px}
.iconbtn-ph{width:44px;height:44px;flex:none}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost{background:transparent;color:var(--accent);min-height:40px;width:auto;padding:0 10px;border-radius:10px}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn .ico{width:18px;height:18px}
.dock{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
/* cartes et listes */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.form{gap:8px}
.label{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:4px}
.field{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{resize:vertical;min-height:72px;font-size:14px;line-height:1.4}
.code-input{font:600 22px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.input-row{display:flex;gap:8px;align-items:stretch}
.input-row .field{flex:1;min-width:0}
.btn-inline{width:auto;min-height:50px;padding:0 14px;border-radius:12px}
.list{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line-2);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.row-item:first-child{border-top:0}
.row-item:hover{background:var(--surface-2)}
.row-item.is-off{cursor:default}
.row-item.is-off:hover{background:transparent}
.row-item.is-off .avatar{background:var(--surface-2);color:var(--muted)}
.row-item.is-off .row-title{color:var(--muted)}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-text .row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 16px;border:0;border-top:1px solid var(--line-2);background:transparent;color:var(--ink);font-weight:500;text-align:left;cursor:pointer}
.rowlink:first-child{border-top:0}
.rowlink.danger{color:var(--danger)}
.rowlink .state{margin-left:auto;font-size:14px;font-weight:400;color:var(--muted)}
.rowlink .ico{width:18px;height:18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--line)}
.choice-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.choice-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.choice-text b{font-size:16px;font-weight:600}
.choice-text span{color:var(--muted);font-size:13px;line-height:1.4}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 17px "Bricolage Grotesque",system-ui,sans-serif;flex:none}
.avatar.lg{width:56px;height:56px;font-size:21px}
.avatar.xl{width:76px;height:76px;font-size:30px}
.count{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--accent-soft);color:var(--accent)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:600;text-align:left;cursor:pointer}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice .ico{width:22px;height:22px}
.notice .grow{flex:1}
.notice .more{font-weight:500;font-size:13px;color:var(--ink-2)}
.notice.alert{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.notice.alert .more{color:rgba(255,255,255,.92)}
.status{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.status[hidden]{display:none}
.status-ok{background:var(--accent-soft);color:var(--accent)}
.status-err{background:var(--danger-soft);color:var(--danger)}
.status.big{font-size:17px;font-weight:600;padding:16px;border-radius:16px}
.status-info{background:var(--warn-soft);color:var(--warn)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--accent)}
.empty b{color:var(--ink);font-weight:600}
/* QR et codes */
.qr-frame{align-self:center;background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.qr-frame img{display:block;width:min(336px,calc(100vw - 56px));height:auto;image-rendering:pixelated}
.code-card{align-items:center;text-align:center}
.code-card .row-between{width:100%}
.fallback{border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--surface);color:var(--ink-2)}
.fallback summary{cursor:pointer;font-weight:600;font-size:14px}
.fallback[open] summary{margin-bottom:10px}
.fallback .stack{margin-top:10px}
/* étapes */
.step-card{gap:12px}
.step-head{display:flex;align-items:center;gap:12px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px "IBM Plex Mono",ui-monospace,monospace;flex:none}
.step-n.done{background:var(--accent);color:var(--on-accent)}
.step-head b{font-size:15px;font-weight:600}
.file-btn{position:relative;cursor:pointer}
.progress{display:flex;flex-direction:column;gap:0}
.pstep{display:flex;gap:14px;align-items:flex-start;padding-bottom:18px;position:relative}
.pstep:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.pstep.done:not(:last-child)::before{background:var(--accent)}
.pstep .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font:600 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.pstep.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pstep.now .dot{border-color:var(--accent);color:var(--accent)}
.pstep b{display:block;font-weight:600}
.pstep span{color:var(--muted);font-size:13px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
/* mots d’empreinte */
.words-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600}
.word-n{font:500 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);min-width:14px}
/* carte d’identité */
.id-card{background:var(--id-bg);color:var(--id-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(16,35,58,.25)}
.id-top{display:flex;justify-content:space-between;font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--id-accent)}
.id-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--id-muted)}
.id-name{font:700 32px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.id-foot{font-size:13px;color:var(--id-muted);line-height:1.45}
.id-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.id-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.id-name{overflow-wrap:anywhere}
.id-qr{flex:none;width:min(88px,25vw)}
.id-qr .qr-build{width:100%;padding:5px;border-radius:8px}
/* marque et écrans d’état */
.brand{display:flex;align-items:center;gap:10px;padding-top:24px;font:600 16px "Bricolage Grotesque",system-ui,sans-serif}
.brand-mark{width:36px;height:36px;color:var(--accent)}
.hero-icon{width:76px;height:76px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;align-self:center}
.hero-icon.danger{background:var(--danger-soft);color:var(--danger)}
.hero-icon .ico{width:34px;height:34px}
.contact-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:8px}
.conv-title{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
/* conversation */
.thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.bubble{max-width:82%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{margin-left:auto;background:var(--accent-soft);border-color:transparent;border-radius:18px 18px 6px 18px}
.tile{display:flex;align-items:center;gap:12px;max-width:82%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);color:var(--ink);text-align:left;cursor:pointer}
.tile .ico{color:var(--accent)}
.tile.mine{margin-left:auto;background:var(--accent-soft);border-color:transparent;cursor:default;color:var(--accent)}
.tile.mine .ico{color:var(--accent)}
.composer{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line-2);background:var(--bg);position:sticky;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.composer-row{display:flex;gap:8px;align-items:center}
.composer-row .field{flex:1;min-width:0}
.btn-plus{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:26px;line-height:1;cursor:pointer}
.mic{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.mic svg{width:20px;height:20px}
.plus-row{display:flex;gap:8px;flex-wrap:wrap}
.tile.unread{background:var(--accent-soft);border:2px solid var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.14)}
.tile.unread b{color:var(--accent)}
.tile.read{opacity:.6;box-shadow:none}
.nouveau{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;vertical-align:middle}
.btn-send{width:auto;min-width:96px;min-height:50px;padding:0 16px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2);align-self:flex-start}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.bubble-timer{margin-top:6px;font-size:12px;color:var(--muted)}
.voice-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.voice-bar audio{width:100%;height:40px}
.voice-dot{width:10px;height:10px;border-radius:50%;background:#d93025;animation:voicepulse 1s infinite}
@keyframes voicepulse{50%{opacity:.25}}
.pending-stack{display:flex;flex-direction:column;gap:8px}
/* QR code décoratif de la page de création (même principe que la maquette) */
.qr-card{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow)}
.qr-build{display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);box-sizing:border-box;width:min(160px,60vw);aspect-ratio:1/1;padding:7px;background:#fff;border-radius:10px}
.qr-build i{display:block}
.qr-build i:not(.l){background:#10233A;animation:build 3.2s ease-in-out infinite both}
.qr-build i.l{background:transparent}
@keyframes build{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion: reduce){.qr-build i:not(.l){animation:none;opacity:1;transform:none}}
.qr-card.plain{background:none;border:0;box-shadow:none;padding:12px 0 4px}
.qr-card.plain .qr-build{width:min(200px,58vw)}
/* Aperçu QR des messages (tuiles) */
.qr-thumb{width:52px;height:52px;flex:none;border-radius:8px;background:#fff;padding:3px;box-sizing:border-box}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt b{font-size:15px;font-weight:600}
.qr-thumb.faded{opacity:.45;filter:grayscale(1)}
.composer-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 13px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
.tool .ico{width:16px;height:16px}
button.chip{cursor:pointer;font:inherit}
.attach-row{display:flex;gap:6px;flex-wrap:wrap}
.attach-row:empty{display:none}
.attach-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;max-width:100%}
.attach-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.attach-chip button{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:16px;line-height:1;cursor:pointer}
.link-row{display:flex;gap:8px}
.link-row[hidden]{display:none}
.link-row .field{flex:1;min-width:0}
</style>
<div id="app"><div class="screen"><p class="lead" style="padding-top:24px">Chargement…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {

            async get() {
              // Seule l’identité qui possède le secret de sa boîte peut la lire (le secret n’est ni dans le QR code ni dans les messages)
              const rows = await rpc('pli_fetch', { p_mailbox: value, p_secret: S.me.secret });
              return { docs: rows.map((x) => ({ id: x.msg_id, data: () => x.msg_payload })) };
            }
          };
        },
        doc(id) { return { delete: async () => rpc('pli_ack', { p_id: id, p_mailbox: await mailboxOf(S.me.raw), p_secret: S.me.secret }) }; },
        add(data) {
          const payload = Object.assign({}, data);
          const to = payload.to;
          delete payload.to;
          return rpc('pli_send', { p_mailbox: to, p_payload: payload });
        }
      };
    },
    doc(path) {
      const id = path.split('/')[1];
      return {
        async get() { const d = await rpc('pli_inv_get', { p_id: id }); return { exists: d !== null, data: () => d }; },
        set(data) { return rpc('pli_inv_put', { p_id: id, p_data: data }); },
        delete() { return rpc('pli_inv_delete', { p_id: id }); }
      };
    }
  };

  // ---------- relais (suite) ----------
  async function sendTo(peerRaw, body) {
    const to = await mailboxOf(peerRaw);
    await S.db.collection('box').add(Object.assign({ to: to, from: S.me.raw, ts: Date.now() }, body));
  }
  async function closeInviteDoc(id) { try { await S.db.doc('inv/' + id).delete(); } catch (e) {} }

  async function poll() {
    if (!S.db || !S.me || !S.priv || S.pollBusy) return;
    S.pollBusy = true;
    try {
      const to = await mailboxOf(S.me.raw);
      const snap = await S.db.collection('box').where('to', '==', to).get();
      let changed = false;
      const suppressions = [];
      for (const d of snap.docs) {
        const m = d.data() || {};
        try { if (await handle(m, d.id)) changed = true; } catch (e) { console.warn('Pli : message ignoré', e); }
        suppressions.push(S.db.collection('box').doc(d.id).delete().catch(() => {}));
      }
      await Promise.all(suppressions);
      if (changed) { S.needRender = true; alertIncoming(); }
      await afterPoll();
    } catch (e) { /* hors ligne : on réessaie au prochain tour */ }
    finally { S.pollBusy = false; }
  }
  async function handle(m, docId) {
    switch (m.kind) {
      case 'ff-request': return onFFRequest(m);
      case 'remote-claim': return onRemoteClaim(m);
      case 'accept': return onAccept(m);
      case 'refuse': return onRefuse(m);
      case 'msg': return onMsg(m, docId);
      case 'voicepart': return onVoicePart(m);
      case 'cut': return onCut(m);
      case 'pause': return onPause(m);
      case 'reprise': return onReprise(m);
      case 'reprise-ok': return onRepriseOk(m);
      default: return false;
    }
  }
  // Demande face à face : acceptée seulement si la personne a tapé le code affiché sur cet écran.
  async function onFFRequest(m) {
    const d = LS.get('display', null);
    const live = !!d && Date.now() < d.exp;
    const expected = live ? await proofFor(unb64u(d.K), m.from) : null;
    if (!live || expected !== m.proof) { await sendTo(m.from, { kind: 'refuse' }); return false; }
    if (pendingAll().some((p) => p.type === 'ff-request' && p.peer === m.from)) return false;
    pushPending({ type: 'ff-request', peer: m.from, peerPseudo: m.pseudo });
    return true;
  }
  // Réponse à une invitation : même principe, avec le code d'invitation.
  async function onRemoteClaim(m) {
    const invs = invitesAll();
    const inv = invs.find((i) => i.id === m.inv);
    if (!inv || inv.status !== 'open' || Date.now() > inv.exp) { await sendTo(m.from, { kind: 'refuse', inv: m.inv }); return false; }
    const expected = await proofFor(unb64u(inv.K), m.from);
    if (expected !== m.proof) {
      inv.fails = (inv.fails || 0) + 1;
      if (inv.fails >= MAX_FAILS) { inv.status = 'closed'; await closeInviteDoc(inv.id); S.flash = { t: 'Une invitation a été fermée après plusieurs codes incorrects.' }; }
      setInvites(invs);
      await sendTo(m.from, { kind: 'refuse', inv: m.inv });
      return true;
    }
    if (pendingAll().some((p) => p.type === 'remote-claim' && p.peer === m.from && p.invId === m.inv)) return false;
    pushPending({ type: 'remote-claim', peer: m.from, peerPseudo: m.pseudo, invId: m.inv });
    return true;
  }
  async function onAccept(m) {
    const pend = pendingAll();
    let idx = pend.findIndex((p) => p.type === 'ff-sent' && p.peer === m.from);
    if (idx < 0 && m.inv) idx = pend.findIndex((p) => p.type === 'remote-sent' && p.invId === m.inv);
    if (idx < 0) return false;
    const p = pend[idx];
    pend[idx] = { pid: p.pid, at: Date.now(), type: p.type === 'ff-sent' ? 'ff-accepted' : 'remote-accepted', peer: m.from, peerPseudo: m.pseudo || 'Contact', invId: p.invId || null };
    LS.set('pending', pend);
    return true;
  }
  async function onRefuse(m) {
    const pend = pendingAll();
    const idx = pend.findIndex((p) => (p.type === 'ff-sent' && p.peer === m.from) || (p.type === 'remote-sent' && p.invId === m.inv));
    if (idx < 0) return false;
    pend.splice(idx, 1); LS.set('pending', pend);
    S.flash = { t: 'La demande a été refusée, ou le code est incorrect.' };
    return true;
  }
  async function onMsg(m, docId) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    const key = await sharedKey(c.raw);
    const body = await decryptFrom(key, m.iv, m.ct);
    const all = msgsAll();
    all.push({ mid: docId, cid: c.cid, dir: 'in', text: String(body.t || ''), state: 'new', ts: body.ts || Date.now(), once: body.once !== false });
    LS.set('msgs', all);
    return true;
  }
  async function onCut(m) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    removeContact(c.cid);
    S.cut = { name: c.name || c.pseudo };   // le nom que la personne a donné à ce contact, pas son pseudo
    return true;
  }
  // La personne a supprimé son identité en gardant ses contacts : le lien reste en pause.
  async function onPause(m) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    let p;
    try { p = await decryptFrom(await sharedKey(c.raw), m.iv, m.ct); } catch (e) { return false; }
    if (c.rts && Number(p.ts) <= c.rts) return false;
    const all = contacts(); const x = all.find((y) => y.cid === c.cid);
    x.pause = { since: Date.now() }; x.rts = Number(p.ts) || Date.now();
    LS.set('contacts', all);
    S.flash = { t: (x.name || x.pseudo) + ' a supprimé son identité. Le lien reste en pause pendant 7 jours.' };
    return true;
  }
  // Reprise : la personne a installé ses contacts avec sa nouvelle identité. Le lien repart, sans nouveau QR code.
  async function onReprise(m) {
    if (typeof m.old !== 'string') return false;
    const c = contacts().find((x) => x.raw === m.old || x.prev === m.old);
    if (!c) return false;
    let p;
    try { p = await decryptFrom(await sharedKey(m.old), m.iv, m.ct); } catch (e) { return false; }
    if (!p || typeof p.raw !== 'string' || p.raw.length < 40) return false;
    if (c.rts && Number(p.ts) <= c.rts) return false;
    const all = contacts(); const x = all.find((y) => y.cid === c.cid);
    if (x.raw === m.old) { x.prev = m.old; x.raw = p.raw; }
    x.pseudo = String(p.pseudo || x.pseudo || '');
    x.rts = Number(p.ts) || Date.now();
    delete x.pause;
    LS.set('contacts', all);
    try { await sendAuth(x.raw, 'reprise-ok', { ts: Date.now() }); } catch (e) { /* renvoyé à la prochaine reprise */ }
    S.flash = { t: (x.name || x.pseudo) + ' a repris le lien avec vous.', ok: true };
    return true;
  }
  // Confirmation : le lien est rétabli de notre côté aussi.
  async function onRepriseOk(m) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c || !c.pend) return false;
    try { await decryptFrom(await sharedKey(c.raw), m.iv, m.ct); } catch (e) { return false; }
    const all = contacts(); const x = all.find((y) => y.cid === c.cid);
    delete x.pend; LS.set('contacts', all);
    S.flash = { t: (x.name || x.pseudo) + ' : lien rétabli.', ok: true };
    return true;
  }
  // Pause expirée (7 jours sans reprise) : le lien est retiré.
  function expirePauses() {
    const limite = Date.now() - PAUSE_MS;
    const perdus = contacts().filter((c) => c.pause && c.pause.since < limite);
    perdus.forEach((c) => removeContact(c.cid));
    if (perdus.length) S.flash = { t: 'Le lien avec ' + (perdus[0].name || perdus[0].pseudo) + ' a expiré : la pause a duré 7 jours.' };
    return perdus.length > 0;
  }

  // ---------- après un relevé ----------
  async function openPending(pid, screen) {
    const p = pendingById(pid);
    if (!p) return go('accueil');
    S.words = (screen === 'demande' || screen === 'verifier-ff' || screen === 'lien-ouvert' || screen === 'nommer') ? await wordsFor(unb64u(S.me.raw), unb64u(p.peer)) : null;
    go(screen, pid);
  }
  async function afterPoll() {
    if (!S.me || !S.priv) return;
    if (expirePauses()) S.needRender = true;
    const pend = pendingAll();
    if (S.cut && S.screen !== 'lien-coupe') return go('lien-coupe');
    // Demande reçue : sa page s’ouvre toute seule, sauf si on est en train de taper quelque chose.
    const req = pend.find((p) => (p.type === 'ff-request' || p.type === 'remote-claim') && !S.routed.has(p.pid));
    if (req && !isTyping()) { S.routed.add(req.pid); return openPending(req.pid, req.type === 'ff-request' ? 'demande' : 'lien-ouvert'); }
    const acc = pend.find((p) => p.type === 'ff-accepted' && !S.routed.has(p.pid));
    if (acc) { S.routed.add(acc.pid); return openPending(acc.pid, 'verifier-ff'); }
    const racc = pend.find((p) => p.type === 'remote-accepted' && !S.routed.has(p.pid));
    if (racc) { S.routed.add(racc.pid); return openPending(racc.pid, 'nommer'); }
    if (S.screen === 'attente' && !pend.some((p) => p.type === 'ff-sent' || p.type === 'remote-sent')) {
      S.words = null;
      S.flash = { t: 'La demande a été refusée, ou le code est incorrect.' };
      return go('accueil');
    }
    if (S.needRender && !isTyping() && !voicePlaying()) render();
  }
  function isTyping() { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); }
  let pollTimer = null;
  function startPolling() { if (!pollTimer) pollTimer = setInterval(poll, 2000); poll(); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  // ---------- composants ----------
  function topbar(o) {
    const back = o.backAct
      ? '<button class="iconbtn" data-act="' + o.backAct + '" data-arg="' + esc(o.backArg || '') + '" aria-label="Retour">' + I.back + '</button>'
      : (o.back ? '<button class="iconbtn" data-act="go" data-arg="' + o.back + '" aria-label="Retour">' + I.back + '</button>' : '');
    return '<header class="topbar' + (back ? '' : ' bare') + '">' + back + '<h1 class="topbar-title">' + (o.titleHTML || esc(o.title || '')) + '</h1><div class="topbar-right">' + (o.right || '') + '</div></header>';
  }
  function notice(kind, text) { return '<div class="status status-' + kind + '">' + text + '</div>'; }
  function formStatus() { return '<div id="formstatus" class="status status-err" hidden></div>'; }
  function pendingBanner() {
    const p = pendingAll().find((x) => x.type === 'ff-request' || x.type === 'remote-claim');
    return p ? '<div class="pending-stack">' + noticeHTML(p) + '</div>' : '';
  }
  function noticeHTML(p) {
    const map = {
      'ff-request': ['Une personne a scanné votre identité', 'Vérifier et répondre', 'demande'],
      'remote-claim': ['Quelqu’un a rejoint votre invitation', 'Vérifier et répondre', 'lien-ouvert'],
      'ff-accepted': [esc(p.peerPseudo || 'La personne') + ' a accepté votre demande', 'Comparer les mots', 'verifier-ff'],
      'remote-accepted': [esc(p.peerPseudo || 'La personne') + ' a accepté votre invitation', 'Donner un nom', 'nommer']
    };
    const m = map[p.type];
    if (!m) return '';
    return '<button class="notice' + (p.type === 'ff-request' || p.type === 'remote-claim' ? ' alert' : '') + '" data-act="openp" data-arg="' + m[2] + '|' + esc(p.pid) + '">' + I.inbox + '<span class="grow">' + m[0] + '<br><span class="more">' + m[1] + '</span></span>' + I.chev + '</button>';
  }
  function personCard(pseudo, badgeText) {
    return '<div class="card"><div class="row-between"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="avatar lg">' + esc(initial(pseudo)) + '</span><div style="min-width:0"><div class="row-title">' + esc(pseudo) + '</div><span class="hint">Pseudo reçu</span></div></div><span class="badge badge-ok">' + I.check + esc(badgeText) + '</span></div></div>';
  }
  function nameField() {
    return '<div class="card form"><label class="label" for="cname">Nom dans vos contacts</label><input id="cname" class="field" placeholder="Nom obligatoire" autocomplete="off">' + (contactPickerOk()
        ? '<button class="btn btn-secondary" data-act="pickcontact" style="margin-top:8px">Choisir dans mes contacts</button>'
        : '<label class="btn btn-secondary file-btn" style="margin-top:8px">' + I.file + '<span>Prendre le nom dans un fichier de contacts (.vcf)</span><input id="vcard" class="sr-only" type="file" accept=".vcf,text/vcard,text/x-vcard"></label><div id="vcardlist"></div>' +
          '<p class="hint">Le navigateur de l’iPhone ne peut pas lire vos contacts. Enregistrez la fiche en fichier .vcf (Contacts, Partager le contact, Enregistrer dans Fichiers), puis choisissez-la ici. Sinon, tapez le nom.</p>') +
      '<p class="hint">Vous seul le voyez. Il ne quitte pas cet appareil.</p>' + formStatus() + '</div>';
  }
  function wordsBlock(title, text) {
    const w = S.words || [];
    return '<section class="card"><div class="section-title" style="margin:0">' + esc(title) + '</div><div class="words-grid">' + w.map((x, i) => '<div class="word"><span class="word-n">' + (i + 1) + '</span><span>' + esc(x) + '</span></div>').join('') + '</div><p class="hint">' + esc(text) + '</p></section>';
  }
  function progressStep(n, label, state, hint) {
    return '<div class="pstep ' + state + '"><span class="dot">' + (state === 'done' ? I.check.replace('class="ico"', 'class="ico" style="width:14px;height:14px"') : n) + '</span><div><b>' + esc(label) + '</b>' + (hint ? '<span>' + esc(hint) + '</span>' : '') + '</div></div>';
  }
  function choice(act, arg, icon, title, desc) {
    return '<button class="choice" data-act="' + act + '"' + (arg ? ' data-arg="' + arg + '"' : '') + '><span class="choice-icon">' + icon + '</span><span class="choice-text"><b>' + esc(title) + '</b><span>' + esc(desc) + '</span></span>' + I.chev + '</button>';
  }
  // Aperçu QR d'un message : décoratif, il ne révèle rien du contenu.
  const thumbs = new Map();
  function qrThumb(key) {
    if (thumbs.has(key)) return thumbs.get(key);
    let url = '';
    try { const q = qrcode(0, 'L'); q.addData('PLI|' + key); q.make(); url = q.createDataURL(3, 1); } catch (e) { url = ''; }
    thumbs.set(key, url);
    return url;
  }
  // ---------- messages vocaux : enregistrés ici, chiffrés, envoyés en morceaux, écoutés dans la conversation ----------
  const VOICE_MAX_MS = 60000, VOICE_PART = 28000;   // une minute au plus ; morceaux de 28 000 caractères (le relais accepte 30 000 par message, en-tête compris)
  let vdbP = null;
  function vdb() {
    if (!vdbP) vdbP = new Promise((resolve, reject) => {
      const r = indexedDB.open('pli-voix', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('audio'); r.result.createObjectStore('parts'); };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
    return vdbP;
  }
  async function vget(store, key) {
    const db = await vdb();
    return new Promise((resolve, reject) => { const q = db.transaction(store, 'readonly').objectStore(store).get(key); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error); });
  }
  async function vput(store, key, value) {
    const db = await vdb();
    return new Promise((resolve, reject) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(value, key); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); });
  }
  async function vdel(store, key) {
    const db = await vdb();
    return new Promise((resolve, reject) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); });
  }
  function blobBytes(b) {
    return new Promise((resolve, reject) => { const fr = new FileReader(); fr.onload = () => resolve(new Uint8Array(fr.result)); fr.onerror = () => reject(fr.error); fr.readAsArrayBuffer(b); });
  }
  // Pas de redessin pendant une écoute : la lecture ne s’interrompt pas.
  // Un vocal qui se joue ne se ferme pas : son délai repart à chaque seconde d’écoute, puis court après la fin.
  function keepVoiceOpen(mid) {
    const all = msgsAll();
    const m = all.find((x) => x.mid === mid);
    if (m && m.state === 'open') { m.until = Date.now() + REVEAL_MS; LS.set('msgs', all); }
  }
  function voicePlaying() { return Array.from(document.querySelectorAll('audio[data-voice]')).some((a) => !a.paused && !a.ended); }
  function hydrateVoices() {
    document.querySelectorAll('audio[data-voice]').forEach(async (el) => {
      if (el.getAttribute('src')) return;
      try { const b = await vget('audio', el.dataset.voice); if (b) el.src = URL.createObjectURL(b); } catch (e) { /* audio indisponible sur ce téléphone */ }
    });
  }
  function pickMime() {
    const l = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return l.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  }
  async function startVoice(direct) {
    if (S.voice) return;
    if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return flashNow({ t: 'Le message vocal n’est pas disponible sur ce téléphone.' });
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return flashNow({ t: 'Micro refusé. Autorisez-le pour cette appli.' }); }
    if (S.voice || S.screen !== 'conv') { stream.getTracks().forEach((t) => t.stop()); return; }
    const mime = pickMime();
    let rec;
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 }); }
    catch (e) { stream.getTracks().forEach((t) => t.stop()); return flashNow({ t: 'Enregistrement impossible sur ce téléphone.' }); }
    const v = { phase: 'rec', rec: rec, stream: stream, chunks: [], start: Date.now(), timer: null, cid: S.arg, direct: !!direct };
    rec.ondataavailable = (e) => { if (e.data && e.data.size) v.chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(v.timer);
      const blob = new Blob(v.chunks, { type: rec.mimeType || mime || 'audio/webm' });
      S.voice = { phase: 'ready', blob: blob, url: URL.createObjectURL(blob), dur: Math.max(1, Math.round((Date.now() - v.start) / 1000)), cid: v.cid };
      if (v.direct) return actSendVoice(v.cid);   // micro du champ : le vocal part dès l’arrêt
      if (S.screen === 'conv') render();
    };
    S.voice = v;
    rec.start(1000);
    v.timer = setInterval(() => {
      const s = Math.floor((Date.now() - v.start) / 1000);
      const el = $('#voicetimer');
      if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      if (Date.now() - v.start >= VOICE_MAX_MS) stopVoice();
    }, 500);
    render();
  }
  // Arrêt normal : le vocal part tout de suite. Appli quittée : il reste en attente (bouton « Envoyer le vocal »), rien ne part seul.
  function stopVoice(sansEnvoi) {
    const v = S.voice;
    if (!v || v.phase !== 'rec' || v.rec.state === 'inactive') return;
    if (sansEnvoi) v.direct = false;
    v.rec.stop();
  }
  function cancelVoice() {
    const v = S.voice;
    if (!v) return;
    if (v.phase === 'rec') {
      v.rec.onstop = null;
      clearInterval(v.timer);
      if (v.rec.state !== 'inactive') v.rec.stop();
      v.stream.getTracks().forEach((t) => t.stop());
    }
    if (v.url) URL.revokeObjectURL(v.url);
    S.voice = null;
  }
  function voiceBarHTML(cid) {
    const v = S.voice;
    if (v.phase === 'rec') return '<div class="voice-bar"><span class="voice-dot"></span><span id="voicetimer" class="mono">0:00</span><span style="flex:1"></span><button class="btn btn-ghost" type="button" data-act="voicecancel">Annuler</button><button class="btn btn-primary" type="button" data-act="voicestop">Envoyer</button></div>';
    if (v.phase === 'ready') return '<div class="voice-bar"><audio controls src="' + esc(v.url) + '"></audio><div class="row-between" style="width:100%"><button class="btn btn-ghost" type="button" data-act="voicecancel">Annuler</button><button class="btn btn-primary" type="button" data-act="voicesend" data-arg="' + esc(cid) + '">Envoyer le vocal</button></div></div>';
    return '<div class="voice-bar"><span id="voiceprog" class="hint">Envoi du vocal en cours…</span></div>';
  }
  async function actSendVoice(cid) {
    const v = S.voice;
    if (!v || v.phase !== 'ready') return;
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return go('accueil');
    v.phase = 'sending';
    render();
    try {
      const bytes = await blobBytes(v.blob);
      const key = await sharedKey(c.raw);
      const body = await encryptFor(key, { mime: v.blob.type, once: S.once !== false, ts: Date.now(), dur: v.dur, a: b64u(bytes) });
      const n = Math.ceil(body.ct.length / VOICE_PART);
      const vid = rid(12);
      // Quatre morceaux à la fois : un vocal enregistré sur iPhone peut compter une soixantaine de morceaux.
      let envoyes = 0, echec = false;
      const suivant = { i: 0 };
      const envoyer = async () => {
        while (!echec && suivant.i < n) {
          const i = suivant.i++;
          try { await sendTo(c.raw, { kind: 'voicepart', vid: vid, i: i, n: n, iv: body.iv, d: body.ct.slice(i * VOICE_PART, (i + 1) * VOICE_PART) }); }
          catch (e) { echec = true; throw e; }
          envoyes++;
          const el = $('#voiceprog');
          if (el) el.textContent = 'Envoi du vocal : ' + envoyes + ' / ' + n;
        }
      };
      await Promise.all([envoyer(), envoyer(), envoyer(), envoyer()]);
      const all = msgsAll();
      all.push({ mid: rid(10), cid: cid, dir: 'out', kind: 'voice', dur: v.dur, state: 'sent', ts: Date.now(), once: S.once !== false });
      LS.set('msgs', all);
      cancelVoice();
      go('conv', cid);
    } catch (e) {
      if (S.voice === v) v.phase = 'ready';
      render();
      flashNow({ t: 'Envoi impossible. Vérifiez la connexion, puis réessayez.' });
    }
  }
  // Morceaux reçus : quand tous sont là, le vocal est déchiffré et rangé sur ce téléphone.
  async function onVoicePart(m) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    const rec = (await vget('parts', m.vid)) || { n: m.n, iv: m.iv, pieces: [] };
    rec.pieces[m.i] = m.d;
    const complet = Array.from({ length: rec.n }).every((_, k) => typeof rec.pieces[k] === 'string');
    if (!complet) { await vput('parts', m.vid, rec); return false; }
    const key = await sharedKey(m.from);
    const body = await decryptFrom(key, rec.iv, rec.pieces.join(''));
    await vput('audio', m.vid, new Blob([unb64u(body.a)], { type: body.mime || 'audio/webm' }));
    await vdel('parts', m.vid);
    const all = msgsAll();
    all.push({ mid: m.vid, cid: c.cid, dir: 'in', kind: 'voice', dur: body.dur || 0, state: 'new', ts: body.ts || Date.now(), once: body.once !== false });
    LS.set('msgs', all);
    return true;
  }

  // QR code décoratif de la page de création : les modules apparaissent et s'effacent, comme pendant une génération.
  function qrDecorCells() {
    const N = 21;
    let seed = 20260311;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const finder = (r, c, r0, c0) => { const i = r - r0, j = c - c0; return i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4); };
    let out = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const sep = (r === 7 && c <= 7) || (c === 7 && r <= 7) || (r === 7 && c >= 13) || (c === 13 && r <= 7) || (r === 13 && c <= 7) || (c === 7 && r >= 13);
        let dark;
        if (r < 7 && c < 7) dark = finder(r, c, 0, 0);
        else if (r < 7 && c >= 14) dark = finder(r, c, 0, 14);
        else if (r >= 14 && c < 7) dark = finder(r, c, 14, 0);
        else if (sep) dark = false;
        else if (r === 6) dark = c % 2 === 0;
        else if (c === 6) dark = r % 2 === 0;
        else dark = rnd() > 0.5;
        const d = (rnd() * 2.4).toFixed(2);
        out += dark ? '<i style="animation-delay:' + d + 's"></i>' : '<i class="l"></i>';
      }
    }
    return out;
  }

  }

  // Noms des fiches d’un fichier .vcf : le fichier est lu sur cet appareil, rien n’est envoyé.
  function parseVcardNames(text) {
    const lignes = String(text || '').replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n');
    const val = (s) => s.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();
    const noms = [];
    let fn = '', nom = '';
    for (const ligne of lignes) {
      const i = ligne.indexOf(':');
      if (i < 0) continue;
      const cle = ligne.slice(0, i).split(';')[0].split('.').pop().toUpperCase();
      const v = ligne.slice(i + 1);
      if (cle === 'BEGIN') { fn = ''; nom = ''; }
      else if (cle === 'FN' && !fn) fn = val(v);
      else if (cle === 'N' && !nom) { const p = v.split(';'); nom = [p[1], p[0]].map((x) => val(x || '')).filter(Boolean).join(' '); }
      else if (cle === 'END') { const titre = (fn || nom).slice(0, 40); if (titre) noms.push(titre); fn = ''; nom = ''; }
    }
    return noms;
  }

  // ---------- sauvegarde chiffrée : le fichier reste entre vos mains ----------
  async function sealWithCode(code, obj) {
    const salt = rand(16), iv = rand(12);
    const kb = await pbkdf2(code, salt, ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj))));
    return JSON.stringify({ pli: 1, s: b64u(salt), i: b64u(iv), c: b64u(ct) }, null, 1);
  }
  async function openWithCode(code, text) {
    let box = null;
    try { box = JSON.parse(text); } catch (e) { box = null; }
    if (!box || box.pli !== 1 || !box.s || !box.i || !box.c) throw new Error('Ce fichier n’est pas une sauvegarde Pli Scellé.');
    const kb = await pbkdf2(code, unb64u(box.s), ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    let pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(box.i) }, key, unb64u(box.c)); }
    catch (e) { throw new Error('Code secret incorrect, ou sauvegarde abîmée.'); }
    return JSON.parse(dec.decode(pt));
  }
  // Sauvegarde des contacts : pour chaque lien, l’adresse de la personne, l’ancienne adresse et la clé du lien. Jamais la clé de votre identité.
  async function backupPayloadV2() {
    const liste = [];
    for (const c of contacts()) {
      const lien = c.pend ? { old: c.pend.old, lk: c.pend.lk } : { old: S.me.raw, lk: b64u(await sharedBits(c.raw)) };
      liste.push({ name: c.name, pseudo: c.pseudo || '', raw: c.raw, label: c.label, since: c.since, old: lien.old, lk: lien.lk });
    }
    return { v: 2, at: Date.now(), contacts: liste };
  }
  function validContacts(o) {
    return !!o && o.v === 2 && Array.isArray(o.contacts) && o.contacts.every((c) => c && typeof c.raw === 'string' && typeof c.old === 'string' && typeof c.lk === 'string' && c.raw.length > 40 && c.old.length > 40 && c.lk.length > 20);

  // ---------- affichage ----------
  function go(screen, arg) {
    cancelVoice();   // quitter l’écran arrête le micro et jette l’enregistrement en cours
    if (screen !== 'lien-coupe') S.cut = null;
    if (screen !== 'sauvegarde') { S.delMode = false; S.backupText = null; S.backupDone = false; }
    if (screen !== 'scanner') { S.scanKind = null; S.scanText = ''; }
    S.screen = screen;

  function render() {
    expireOpened();
    const app = $('#app');
    const fn = VIEWS[S.screen] || VIEWS.boot;
    // Même écran et même contact : brouillon, lien en cours et focus survivent au redessin.
    const key = S.screen + ':' + S.arg;
    const same = app.dataset.view === key;
    if (!same) { S.attach = []; S.linkOpen = false; S.plusOpen = false; }
    const keep = {};
    if (same) ['draft', 'linkIn', 'fcode', 'qrtext'].forEach((id) => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
    const act = document.activeElement;
    const focusId = same && act && (act.id === 'draft' || act.id === 'linkIn') ? act.id : null;
    let html;
    try { html = fn(); } catch (e) { console.error(e); html = '<div class="screen">' + notice('err', 'Affichage impossible : ' + esc(e.message)) + '</div>'; }
    const flash = S.flash ? notice(S.flash.ok ? 'ok' : 'info', esc(S.flash.t)) : '';
    S.flash = null; S.needRender = false;
    const pres = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;   // l’utilisateur était en bas
    app.innerHTML = flash + html;

  // Image du QR code en PNG (fond blanc), pour être scannée par une caméra.
  function qrPngBlob() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const g = c.getContext('2d');
        g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('png'))), 'image/png');
      };
      img.onerror = () => reject(new Error('image'));
      img.src = S.invQR;
    });
  }
  // Une image n’est pas cliquable dans une messagerie : le lien part donc en texte, sur sa propre ligne (cliquable partout),

  async function actShareLink(id) {
    const inv = invitesAll().find((i) => i.id === id);
    if (!inv) return;
    const lien = invTextFor(inv);
    const texte = 'Ajoutez-moi sur Pli Scellé. Touchez ce lien, puis entrez le code que je vous donne à part :\n' + lien;
    if (navigator.share) {
      let fichiers = [];
      try { if (S.invQR) fichiers = [new File([await qrPngBlob()], 'invitation-pli-scelle.png', { type: 'image/png' })]; } catch (e) { fichiers = []; }
      const avecImage = fichiers.length > 0 && !!navigator.canShare && navigator.canShare({ files: fichiers });
      try {
        await navigator.share(avecImage ? { files: fichiers, title: 'Pli Scellé', text: texte } : { title: 'Pli Scellé', text: texte });
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copyText(lien, 'Lien copié. Collez-le dans la messagerie de votre choix.');
  }
    async function actSaveQR(id) {

  async function actSend(cid) {
    const lien = contacts().find((x) => x.cid === cid);
    if (lien && (lien.pause || lien.pend)) return flashNow({ t: 'Le lien n’est pas actif : écrire est impossible pour l’instant.' });
    const inp = $('#draft');
    const text = (inp.value || '').trim();
    if (!text) { if ((S.attach || []).length) flashNow({ t: 'Photos, documents et liens : envoi pas encore disponible. Ajoutez un message.' }); return; }
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return go('accueil');
    const key = await sharedKey(c.raw);
    const body = await encryptFor(key, { t: text, ts: Date.now(), once: S.once !== false });
    const to = await mailboxOf(c.raw);
    await S.db.collection('box').add({ to: to, from: S.me.raw, kind: 'msg', ts: Date.now(), iv: body.iv, ct: body.ct });
    const all = msgsAll();
    all.push({ mid: rid(10), cid: cid, dir: 'out', state: 'sent', ts: Date.now(), once: S.once !== false });
    LS.set('msgs', all);
    if ((S.attach || []).length) { S.attach = []; S.flash = { t: 'Seul le texte est envoyé pour l’instant.', ok: true }; }
    inp.value = '';

  // Installer la sauvegarde des contacts : ils apparaissent « À réactiver » jusqu’à la réponse de chaque personne.
  async function actInstall() {
    const code = $('#rcode').value || '';
    const text = ($('#rtext').value || '').trim();
    if (!text) return setStatus('formstatus', 'err', 'Choisissez le fichier de sauvegarde.');
    if (!code) return setStatus('formstatus', 'err', 'Entrez le code secret de la sauvegarde.');
    let o;

    const t = ev.target;
    if (!t || (t.id !== 'pickPhoto' && t.id !== 'pickDoc') || !t.files || !t.files[0]) return;
    S.attach = S.attach || [];
    S.attach.push({ kind: t.id === 'pickPhoto' ? 'photo' : 'document', label: t.files[0].name });
    t.value = '';
    S.plusOpen = false;   // le menu « + » se referme après le choix
    render();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopVoice(true); else { poll(); verifierVersion(); } });

  function tick() {
    const cd = document.getElementById('cd');
    const d = LS.get('display', null);
    if (cd && d) {
      const s = Math.max(0, Math.round((d.exp - Date.now()) / 1000));
      cd.textContent = Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
    }
    document.querySelectorAll('audio[data-voice]').forEach((a) => { if (!a.paused && !a.ended) keepVoiceOpen(a.dataset.voice); });
    if (expireOpened() && S.screen === 'conv') render();
    document.querySelectorAll('[data-until]').forEach((el) => {
      const s = Math.max(0, Math.ceil((Number(el.dataset.until) - Date.now()) / 1000));
      el.textContent = 'Se referme dans ' + s + ' s';
    });
  }
  setInterval(tick, 1000);

  // ---------- alertes : sonnerie à la réception (facultative, réglée dans « Mon identité ») ----------
  function getPrefs() { const p = LS.get('prefs', null) || {}; return { sound: !!p.sound, tone: (p.tone && TONES[p.tone]) ? p.tone : 'carillon', notif: !!p.notif, push: !!p.push }; }
  function setPref(k, v) { LS.set('prefs', Object.assign(getPrefs(), { [k]: v })); }
  // Son : un seul contexte audio pour toute la session, jamais recréé (iOS en limite le nombre et cesse de jouer).
  // iOS le suspend hors d’un toucher : on le reprend à chaque toucher, ce qui est le seul moment où il accepte le son.
  let ctxSon = null;
  function sonContexte() {
    if (!ctxSon) { try { ctxSon = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxSon = null; } }
    return ctxSon;
  }
  function sonPret() { const c = sonContexte(); return !!c && c.state === 'running'; }
  function touchSon() {
    const c = sonContexte();
    if (!c || c.state === 'running') return;
    try {
      c.resume().then(() => { S.needRender = true; }).catch(() => {});
      const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
    } catch (e) { /* son indisponible sur ce téléphone */ }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, touchSon));
  // Sonneries au choix : suites de notes générées sur place, sans fichier.
  const TONES = {
    carillon: { label: 'Carillon', type: 'sine', gain: 0.4, len: 0.3, notes: [[1046, 0], [1318, 0.18], [1568, 0.36], [1046, 0.75], [1318, 0.93], [1568, 1.11]] },
    deux: { label: 'Deux notes', type: 'triangle', gain: 0.45, len: 0.45, notes: [[880, 0], [660, 0.35], [880, 0.7], [660, 1.05]] },
    cloche: { label: 'Cloche', type: 'sine', gain: 0.3, len: 1.6, notes: [[660, 0], [990, 0], [1320, 0], [660, 1.1], [990, 1.1], [1320, 1.1]] },
    doux: { label: 'Doux', type: 'sine', gain: 0.25, len: 0.9, notes: [[392, 0], [494, 0.5], [587, 1.0]] }
  };
  function toneChipsHTML() {
    return '<div class="stack" style="margin-top:10px"><span class="hint">Son de la sonnerie (touchez un son pour l’entendre)</span><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      Object.keys(TONES).map((k) => '<button class="chip' + (getPrefs().tone === k ? ' on' : '') + '" type="button" data-act="settone" data-arg="' + k + '">' + TONES[k].label + '</button>').join('') +
      '</div></div>';
  }
  // « geste » est vrai quand la sonnerie est demandée par un toucher (essai, réglage). Hors toucher, iOS refuse le son :
  // on ne le joue pas en retard, l’accueil signale que la sonnerie est en pause.
  function playChime(tone, geste) {
    try {
      const c = sonContexte();
      if (!c) return;
      if (c.state !== 'running') { if (!geste) return; touchSon(); }
      const def = TONES[tone || getPrefs().tone] || TONES.carillon;
      const t0 = c.currentTime + 0.02;
      def.notes.forEach(([f, dt]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = def.type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(def.gain, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + def.len);
        o.connect(g); g.connect(c.destination);
        o.start(t0 + dt); o.stop(t0 + dt + def.len + 0.02);
      });
    } catch (e) { /* son indisponible sur ce téléphone : rien à afficher */ }
  }
  // Message reçu : la sonnerie joue si elle est activée (l’appli doit être ouverte).
  // Une seule sonnerie pour une série de messages arrivés ensemble : au plus une toutes les 4 secondes.
  let dernierSon = 0;
  function alertIncoming() {
    if (!getPrefs().sound) return;
    if (Date.now() - dernierSon < 4000) return;
    dernierSon = Date.now();
    playChime();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);   // Android : vibration en plus du son
  }
  // Arrêt des notifications : le service worker et les anciens abonnements sont retirés, pour que rien ne reste sur le téléphone.
  async function cleanupNotifications() {
    if (getPrefs().notif) return;   // notifications activées : le service worker et l’abonnement restent
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) {
          const sub = r.pushManager ? await r.pushManager.getSubscription() : null;
          if (sub) await sub.unsubscribe();
          await r.unregister();
        }
      }
    } catch (e) { /* rien à retirer */ }
    LS.set('prefs', { sound: getPrefs().sound, tone: getPrefs().tone });   // les anciens réglages de notification sont effacés
  }
  // ---------- notifications quand l’appli est fermée (iPhone : appli ajoutée à l’écran d’accueil, iOS 16.4 ou plus récent) ----------
  const standalone = () => !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  const surIphone = () => /iPhone|iPad/.test(navigator.userAgent);
  function registerWorker() {
    if (!('serviceWorker' in navigator)) return Promise.resolve(null);
    return navigator.serviceWorker.register('sw.js').catch(() => null);
  }
  // L’abonnement de cet appareil est enregistré au relais pour la boîte, avec le secret de la boîte.
  // Le service worker doit être actif avant l’abonnement : on attend au plus 8 s.
  const swPret = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('service worker absent')), 8000))]);
  async function subscribePush() {
    if (!('PushManager' in window) || !('serviceWorker' in navigator) || !S.me || !S.me.secret) return false;
    const reg = await swPret();
    if (!reg) return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(PUSH_KEY) });
    try {
      await rpc('pli_push_put', { p_mailbox: await mailboxOf(S.me.raw), p_secret: S.me.secret, p_sub: sub.toJSON() });
    } catch (e) {
      await sub.unsubscribe().catch(() => {});   // pas d’abonnement orphelin si le relais refuse
      throw e;
    }
    return true;
  }
  async function unsubscribePush() {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) await sub.unsubscribe();
    if (S.me && S.me.secret) await rpc('pli_push_delete', { p_mailbox: await mailboxOf(S.me.raw), p_secret: S.me.secret }).catch(() => {});
  }
  async function actToggleNotif() {
    // Activées : on coupe. Désactivées ou en attente : on (ré)essaie de les activer.
    if (getPrefs().notif && getPrefs().push) { await unsubscribePush().catch(() => {}); setPref('notif', false); setPref('push', false); return go('identite'); }
    return actEnableNotif();
  }
  async function actEnableNotif() {
    if (surIphone() && !standalone()) { S.flash = { t: 'Sur iPhone, ajoutez d’abord l’appli à l’écran d’accueil (Partager → Sur l’écran d’accueil), puis ouvrez-la depuis cette icône.' }; return go('identite'); }
    if (!('Notification' in window) || !('PushManager' in window)) { S.flash = { t: 'Les notifications ne sont pas disponibles dans ce navigateur.' }; return go('identite'); }
    let perm = Notification.permission;
    if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; } }
    if (perm !== 'granted') { S.flash = { t: 'Notifications refusées. Autorisez-les pour cette appli dans les réglages du téléphone.' }; return go('identite'); }
    await registerWorker();
    let push = false;
    try { push = await subscribePush(); } catch (e) { push = false; }
    setPref('notif', true);
    setPref('push', push);
    S.flash = push
      ? { t: 'Notifications activées. Elles arrivent aussi quand l’appli est fermée.', ok: true }
      : { t: 'Notifications activées, mais l’envoi quand l’appli est fermée n’est pas encore prêt. Touchez la ligne « Notifications » pour réessayer.', ok: true };
    go('identite');
  }
  // Mise à jour : l’appli compare sa version à celle du site. Une version plus récente fait apparaître un bandeau pour recharger.
  let versionNouvelle = null;
  const numeroVersion = (v) => parseInt(String(v).replace(/\D/g, ''), 10) || 0;
  async function verifierVersion() {
    try {
      const r = await fetch(APP_URL + '?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
      if (m && numeroVersion(m[1]) > numeroVersion(APP_VERSION) && m[1] !== versionNouvelle) { versionNouvelle = m[1]; S.needRender = true; }
    } catch (e) { /* hors ligne : on réessaiera */ }
  }
  // Recharge la dernière version sans passer par le cache du navigateur. Les données restent sur cet appareil.
  function recharger() { location.replace(APP_URL + '?v=' + Date.now()); }
  // Inscription de l’appareil quand les notifications sont voulues. Sans nouveau geste : seulement si la permission est déjà donnée.
  async function retryPush() {
    if (!getPrefs().notif || !S.me || !S.me.secret) return;
    let ok = false;
    try { ok = typeof Notification !== 'undefined' && Notification.permission === 'granted' && await subscribePush(); } catch (e) { ok = false; }
    if (!!ok !== getPrefs().push) { setPref('push', !!ok); S.needRender = true; }
  }
  function notifHintHTML() {
    if (surIphone() && !standalone()) return '<p class="hint">Sur iPhone, ajoutez d’abord l’appli à l’écran d’accueil : Partager → Sur l’écran d’accueil. Ouvrez-la ensuite depuis cette icône pour activer les notifications.</p>';
    if (getPrefs().notif && !getPrefs().push) return '<p class="hint">L’envoi quand l’appli est fermée n’est pas encore prêt. Touchez la ligne « Notifications » pour réessayer.</p>';
    return '<p class="hint">La notification affiche seulement « Une nouvelle activité vous attend. ». Son : celui des notifications de votre téléphone, qui ne change pas avec le choix ci-dessus.</p>';
  }
  async function actToggleSound() {
    if (getPrefs().sound) { setPref('sound', false); return go('identite'); }
    setPref('sound', true);
    playChime(undefined, true);
    S.flash = { t: 'Sonnerie activée. Elle sonne à l’arrivée d’un message, tant que l’appli est ouverte.', ok: true };
    go('identite');
  }

  // ---------- déverrouillage par empreinte ou Face ID (WebAuthn, extension PRF) ----------
  async function bioAvailable() {
    try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
  }
  // Le secret donné par l’appareil, après vérification biométrique, sert de clé pour chiffrer la clé privée.
  async function bioKeyFrom(secret) {
    const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: enc.encode('pli-bio-v1') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function prfFrom(credId, salt) {
    const a = await navigator.credentials.get({ publicKey: {
      challenge: rand(32), rpId: location.hostname,
      allowCredentials: [{ type: 'public-key', id: credId }],
      userVerification: 'required',
      extensions: { prf: { eval: { first: salt } } } } });
    const r = a.getClientExtensionResults().prf;
    if (!r || !r.results || !r.results.first) throw new Error('prf-absent');
    return new Uint8Array(r.results.first);
  }
  async function actEnableBio() {
    const code = ($('#biocode') || {}).value || '';
    if (!code) return setStatus('formstatus', 'err', 'Entrez votre code secret.');
    let pkcs8;
    try { pkcs8 = await unwrapPkcs8(S.me.wrap, code); } catch (e) { return setStatus('formstatus', 'err', 'Code incorrect.'); }
    const salt = rand(32);
    let cred;
    try {
      cred = await navigator.credentials.create({ publicKey: {
        challenge: rand(32),
        rp: { id: location.hostname, name: 'Pli Scellé' },
        user: { id: rand(16), name: 'identite', displayName: 'Pli Scellé' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        extensions: { prf: {} } } });
    } catch (e) { return setStatus('formstatus', 'err', 'Activation annulée ou refusée.'); }
    const prf = cred.getClientExtensionResults().prf;
    if (!prf || !prf.enabled) return setStatus('formstatus', 'err', 'Cet appareil ne propose pas ce déverrouillage pour cette appli. Le code secret reste nécessaire.');
    let secret;
    try { secret = await prfFrom(new Uint8Array(cred.rawId), salt); } catch (e) { return setStatus('formstatus', 'err', 'Activation annulée ou refusée.'); }
    const iv = rand(12);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await bioKeyFrom(secret), pkcs8));
    LS.set('bio', { cred: b64u(new Uint8Array(cred.rawId)), salt: b64u(salt), iv: b64u(iv), ct: b64u(ct) });
    S.flash = { t: 'Déverrouillage biométrique activé sur cet appareil.', ok: true };
    go('identite');
  }
  async function actBioUnlock() {
    const bio = LS.get('bio', null);
    if (!bio) return;
    let pkcs8;
    try {
      const secret = await prfFrom(unb64u(bio.cred), unb64u(bio.salt));
      pkcs8 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(bio.iv) }, await bioKeyFrom(secret), unb64u(bio.ct));
    } catch (e) {
      if (e && e.name === 'NotAllowedError') return setStatus('formstatus', 'err', 'Déverrouillage annulé. Entrez votre code secret.');
      LS.set('bio', null); // clé biométrique périmée : on la retire, le code secret reste valable
      return setStatus('formstatus', 'err', 'Déverrouillage biométrique indisponible. Entrez votre code secret.');
    }
    S.priv = await crypto.subtle.importKey('pkcs8', pkcs8, ECDH, false, ['deriveKey', 'deriveBits']);
    if (!await ensureSecret()) { S.priv = null; return setStatus('formstatus', 'err', 'Cette identité ne peut plus être ouverte ici. Entrez votre code secret, ou créez une nouvelle identité.'); }
    afterAuth();
  }
  function viewBiometrie() {
    const on = !!LS.get('bio', null);
    return '<div class="screen">' + topbar({ back: 'identite', title: 'Empreinte ou Face ID' }) +
      '<div><h1>Empreinte ou Face ID</h1><p class="lead" style="margin-top:6px">Sur ce téléphone, l’empreinte ou Face ID peut ouvrir l’appli à la place du code secret. Le code reste toujours possible.</p></div>' +
      (on
        ? '<div class="card"><p class="hint">Activé sur cet appareil.</p></div><div class="dock"><button class="btn btn-danger" data-act="disablebio">Désactiver</button></div>'
        : '<div class="card form"><label class="label" for="biocode">Code secret</label><input id="biocode" class="field" type="password" autocomplete="off">' + formStatus() + '</div><div class="dock"><button class="btn btn-primary" data-act="enablebio">Activer</button></div>') +
    '</div>';
  }

  async function init() {
    S.me = LS.get('me', null);
    S.db = relayDb;
    try { S.downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { S.downloads = null; }
    const h = String(location.hash || '');
    if (h.indexOf('#inv-') === 0) S.inviteId = h.slice(5).replace(/[^a-z0-9]/g, '');
    if (h.indexOf('#ff-') === 0) { S.ffText = APP_URL + h; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    if (S.inviteId) {
      S.invite = null;
      if (S.db) {
        try {
          const snap = await S.db.doc('inv/' + S.inviteId).get();
          if (snap.exists) {
            const d = snap.data();
            if (Date.now() < d.exp) S.invite = { id: S.inviteId, from: d.from, salt: d.salt, exp: d.exp };
          }
        } catch (e) { S.invite = null; }
      }
    }
    S.bioAvail = await bioAvailable();
    // Versions : au démarrage, au retour sur la fenêtre, puis toutes les 10 minutes (une fenêtre d’appli reste souvent ouverte longtemps)
    verifierVersion();
    setInterval(verifierVersion, 10 * 60 * 1000);
    window.addEventListener('focus', verifierVersion);
    // Au démarrage : l’abonnement est vérifié et réenregistré (il peut avoir changé).
    cleanupNotifications();
    if (getPrefs().notif) registerWorker().then(retryPush).catch(() => {});
    if (!S.me) return go('creer', S.inviteId ? 'invite' : null);
    return go('verrouille', S.inviteId ? 'invite' : null);
  }
  init().catch((e) => { console.error(e); $('#app').innerHTML = '<div class="screen">' + notice('err', 'Erreur au démarrage : ' + esc(e.message)) + '</div>'; });
})();
</script>
