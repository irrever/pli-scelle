<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pli Scellé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#10233A;--ink-2:#33475C;--muted:#5B6B7D;--line:#D3DAE2;--line-2:#E3E8EE;--accent:#0B6B5C;--on-accent:#FFFFFF;--accent-soft:#DDEFEA;--warn:#8A5200;--warn-soft:#FBEFD9;--danger:#B3261E;--danger-soft:#F9E3E1;--id-bg:#10233A;--id-ink:#E6EDF4;--id-muted:#9FB0C3;--id-accent:#9FD8C9;--shadow:0 1px 2px rgba(16,35,58,.06),0 6px 18px rgba(16,35,58,.06);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:460px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding:0 0 16px;animation:in .22s ease both}
#app.meme-ecran .screen{animation:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.spinner{animation:none}}
h1{margin:0;font:600 26px/1.2 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:600 17px/1.3 "Bricolage Grotesque",system-ui,sans-serif}
p{margin:0}
.lead{color:var(--muted);font-size:15px}
.hint{color:var(--muted);font-size:15px;line-height:1.45}
.center{text-align:center;align-items:center}
.center-col{align-items:center;text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-title{font-weight:600;font-size:16px}
.row-sub{color:var(--muted);font-size:15px}
.section-title{font:600 15px/1.3 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink-2);margin:20px 4px 8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.code{font:600 34px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;color:var(--ink)}
.code-sm{font:600 15px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em}
.code-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
.ico{width:20px;height:20px;flex:none}
/* barre du haut */
.topbar{position:relative;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px 8px 8px;background:var(--bg)}
.topbar-title{flex:1;min-width:0;font:600 17px/1.2 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.topbar.bare{padding-left:0}
.topbar-right{display:flex;align-items:center;gap:4px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface)}
.iconbtn .ico{width:22px;height:22px}
.iconbtn-ph{width:44px;height:44px;flex:none}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost{background:transparent;color:var(--accent);min-height:40px;width:auto;padding:0 10px;border-radius:10px}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn .ico{width:18px;height:18px}
.dock{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
/* cartes et listes */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.form{gap:8px}
.label{font-size:15px;font-weight:600;color:var(--ink-2);margin-top:4px}
.field{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{resize:vertical;min-height:72px;font-size:16px;line-height:1.4}
.code-input{font:600 22px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.input-row{display:flex;gap:8px;align-items:stretch}
.input-row .field{flex:1;min-width:0}
.btn-inline{width:auto;min-height:50px;padding:0 14px;border-radius:12px}
.list{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line-2);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.row-item[hidden]{display:none}
.row-item:first-child{border-top:0}
.row-item:hover{background:var(--surface-2)}
.row-item.is-off{cursor:default}
.row-item.is-off:hover{background:transparent}
.row-item.is-off .avatar{background:var(--surface-2);color:var(--muted)}
.row-item.is-off .row-title{color:var(--muted)}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-text .row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 16px;border:0;border-top:1px solid var(--line-2);background:transparent;color:var(--ink);font-weight:500;text-align:left;cursor:pointer}
.rowlink:first-child{border-top:0}
.rowlink.danger{color:var(--danger)}
.rowlink .state{margin-left:auto;font-size:16px;font-weight:400;color:var(--muted)}
.rowlink .ico{width:18px;height:18px}
.rico{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.rico.warn{background:var(--warn-soft);color:var(--warn)}
.rico.danger{background:var(--danger-soft);color:var(--danger)}
.rico .ico{width:20px;height:20px}
.rico + span{flex:1;min-width:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--line)}
.choice-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.choice-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.choice-text b{font-size:16px;font-weight:600}
.choice-text span{color:var(--muted);font-size:15px;line-height:1.4}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 17px "Bricolage Grotesque",system-ui,sans-serif;flex:none}
.avatar.lg{width:56px;height:56px;font-size:21px}
.avatar.xl{width:76px;height:76px;font-size:30px}
.count{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--accent-soft);color:var(--accent)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:600;text-align:left;cursor:pointer}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice .ico{width:22px;height:22px}
.notice .grow{flex:1}
.notice .more{font-weight:500;font-size:15px;color:var(--ink-2)}
.notice.alert{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.notice.alert .more{color:rgba(255,255,255,.92)}
.status{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;font-size:16px;line-height:1.45}
.status[hidden]{display:none}
.flash{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:30;margin:0!important;box-shadow:var(--shadow);pointer-events:none}
.status-ok{background:var(--accent-soft);color:var(--accent)}
.status-err{background:var(--danger-soft);color:var(--danger)}
.status.big{font-size:17px;font-weight:600;padding:16px;border-radius:16px}
.status-info{background:var(--warn-soft);color:var(--warn)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--accent)}
.empty b{color:var(--ink);font-weight:600}
/* QR et codes */
.qr-frame{align-self:center;background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.qr-frame img{display:block;width:min(336px,calc(100vw - 56px));height:auto;image-rendering:pixelated}
.code-card{align-items:center;text-align:center}
.code-card .row-between{width:100%}
.fallback{border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--surface);color:var(--ink-2)}
.fallback summary{cursor:pointer;font-weight:600;font-size:16px}
.fallback[open] summary{margin-bottom:10px}
.fallback .stack{margin-top:10px}
/* étapes */
.step-card{gap:12px}
.step-head{display:flex;align-items:center;gap:12px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px "IBM Plex Mono",ui-monospace,monospace;flex:none}
.step-n.done{background:var(--accent);color:var(--on-accent)}
.step-head b{font-size:15px;font-weight:600}
.file-btn{position:relative;cursor:pointer}
.progress{display:flex;flex-direction:column;gap:0}
.pstep{display:flex;gap:14px;align-items:flex-start;padding-bottom:18px;position:relative}
.pstep:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.pstep.done:not(:last-child)::before{background:var(--accent)}
.pstep .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font:600 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.pstep.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pstep.now .dot{border-color:var(--accent);color:var(--accent)}
.pstep b{display:block;font-weight:600}
.pstep span{color:var(--muted);font-size:15px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
/* mots d’empreinte */
.words-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600}
.word-n{font:500 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);min-width:14px}
button.word{color:var(--ink);font:inherit;font-weight:600;text-align:left;width:100%;cursor:pointer}
.word.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.eyebrow{font:500 12px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* carte d’identité */
.id-card{background:var(--id-bg);color:var(--id-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(16,35,58,.25);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.id-qr{touch-action:none}
.visuellement-cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.id-top{display:flex;justify-content:space-between;font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--id-accent)}
.id-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--id-muted)}
.id-name{font:700 32px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.id-foot{font-size:15px;color:var(--id-muted);line-height:1.45}
.id-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.id-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.id-name{overflow-wrap:anywhere}
.id-qr{flex:none;width:min(88px,25vw)}
.id-qr .qr-build{width:100%;padding:5px;border-radius:8px}
/* marque et écrans d’état */
.brand{display:flex;align-items:center;gap:10px;padding-top:24px;font:600 16px "Bricolage Grotesque",system-ui,sans-serif}
.brand-mark{width:36px;height:36px;color:var(--accent)}
.hero-icon{width:76px;height:76px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;align-self:center}
.hero-icon.danger{background:var(--danger-soft);color:var(--danger)}
.hero-icon .ico{width:34px;height:34px}
.compte-rebours{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.cr-ring{position:relative;width:128px;height:128px}
.cr-ring svg{display:block}
.cr-chiffre{position:absolute;inset:0;display:grid;place-items:center;font:700 44px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--danger)}
.cr-titre{margin:0;font-weight:600;font-size:17px}
.contact-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:8px}
.conv-title{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
/* conversation */
.thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8px 0}
.bubble{max-width:82%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{margin-left:auto;background:var(--accent-soft);border-color:transparent;border-radius:18px 18px 6px 18px}
.tile{display:flex;align-items:center;gap:12px;max-width:82%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);color:var(--ink);text-align:left;cursor:pointer}
.tile .ico{color:var(--accent)}
.tile.mine{margin-left:auto;background:var(--accent-soft);border-color:transparent;cursor:default;color:var(--accent)}
.tile.mine .ico{color:var(--accent)}
.composer{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line-2);background:var(--bg);position:sticky;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer-row .btn-plus{margin-bottom:5px}
.capsule{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:26px}
.capsule:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.capsule .draft{flex:1;min-width:0;height:52px;min-height:52px;max-height:160px;resize:none;border:0;background:transparent;color:var(--ink);outline:none;font:inherit;font-size:16px;line-height:1.4;padding:15px 6px 11px 14px;overflow-y:auto}
.act-btn{width:36px;height:36px;min-width:36px;min-height:36px;margin:0 6px 8px 0;padding:0;border:0;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.act-btn svg{width:18px;height:18px}
.act-mic{background:var(--accent-soft);color:var(--accent)}
.act-send{background:var(--accent);color:var(--on-accent)}
.btn-plus{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:26px;line-height:1;cursor:pointer}
.plus-row{display:flex;gap:8px;flex-wrap:wrap}
.tile.unread{background:var(--accent-soft);border:2px solid var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.14)}
.tile.unread b{color:var(--accent)}
.tile.read{opacity:.6;box-shadow:none}
.nouveau{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;vertical-align:middle}
.btn-send{width:auto;min-width:96px;min-height:50px;padding:0 16px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);align-self:flex-start}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.bubble-timer{margin-top:6px;font-size:14px;color:var(--muted)}
.bubble-ouvert{display:block;width:auto;text-align:left;cursor:pointer}
.bubble-ouvert .bubble-timer{display:block}
.bubble-fin{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.grille-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 6px;padding:4px 0}
.grille-actions .act{width:78px;flex:none}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;width:100%;background:none;border:0;color:var(--ink);font-size:15px;line-height:1.25;text-align:center;cursor:pointer}
.act .rond{width:62px;height:62px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.act.on .rond{background:var(--accent);color:#fff}
.act.danger .rond{color:var(--danger);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--danger)}
.act small{display:block;color:var(--muted);font-size:14px}
.plus-sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px 10px 12px;box-shadow:var(--shadow);display:grid;gap:12px;margin:0 0 8px}
.event-row{display:grid;gap:8px;margin:0 0 8px}
.event-row[hidden]{display:none}
.voice-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.voice-bar audio{width:100%;height:40px}
.voice-dot{width:10px;height:10px;border-radius:50%;background:#d93025;animation:voicepulse 1s infinite}
.voice-rec{flex-direction:column;align-items:stretch}
.voice-line{display:flex;align-items:center;gap:10px;min-width:0}
.voice-actions{display:flex;gap:8px}
.voice-actions .btn{flex:1;min-height:48px}
@keyframes voicepulse{50%{opacity:.25}}
.pending-stack{display:flex;flex-direction:column;gap:8px}
/* QR code décoratif de la page de création (même principe que la maquette) */
.qr-card{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow)}
.qr-build{display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);box-sizing:border-box;width:min(160px,60vw);aspect-ratio:1/1;padding:7px;background:#fff;border-radius:10px}
.qr-build i{display:block}
.qr-build i:not(.l){background:#10233A;animation:build 3.2s ease-in-out infinite both}
.qr-build i.l{background:transparent}
@keyframes build{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.2)}}
@keyframes fondu{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.qr-build i:not(.l){animation-name:fondu}}
.qr-card.plain{background:none;border:0;box-shadow:none;padding:12px 0 4px}
.qr-card.plain .qr-build{width:min(200px,58vw)}
.qr-mini{display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);flex:none;width:46px;height:46px;padding:3px;box-sizing:border-box;background:#fff;border-radius:7px}
.qr-mini i{display:block}
.qr-mini i.l{background:transparent}
.qr-mini i.f{background:#10233A}
.qr-mini i:not(.l):not(.f){background:#10233A;animation:build 3.2s ease-in-out infinite both}
@media (prefers-reduced-motion: reduce){.qr-mini i:not(.l):not(.f){animation-name:fondu}}



.row-item.is-off .qr-mini{opacity:.45}

        c.width = Math.max(1, Math.round(img.naturalWidth * k));
        c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0, c.width, c.height);
        const d = g.getImageData(0, 0, c.width, c.height);

  // Reprise : la personne a installé ses contacts avec sa nouvelle identité. Le lien repart, sans nouveau QR code.
  async function onReprise(m) {

    if (m.auth !== true || typeof m.old !== 'string' || typeof m.from !== 'string') return false;
    const c = contacts().find((x) => x.raw === m.old || x.prev === m.old);
    if (!c) return false;
    let p;
    try { p = await decryptFrom(await sharedKey(m.old), m.iv, m.ct); } catch (e) { return false; }
    if (!p || typeof p.raw !== 'string' || p.raw.length < 40 || p.raw !== m.from) return false;
    if (c.prev === m.old) {
      // Ce lien a déjà été repris : le fichier ne sert plus. Seule la même nouvelle identité peut redemander, pour recevoir l’accusé.
      if (c.raw !== p.raw) return false;

  // Emblème « empreinte » : des anneaux irréguliers, dans le style des maquettes. Son tracé vient de l’empreinte de la
  // conversation : il est propre à chaque contact, et identique sur les deux téléphones.
  function empreinteChemin(octets) {
    const TAU = Math.PI * 2, tilt = -0.42, cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const rot = (x, y) => { const dx = x - 50, dy = y - 50; return [50 + dx * cosT - dy * sinT, 50 + dx * sinT + dy * cosT]; };
    let graine = (((octets[0] << 24) | (octets[1] << 16) | (octets[2] << 8) | octets[3]) >>> 0) % 2147483646 + 1;
    const rnd = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
    const anneaux = [];
    for (let i = 0; i < 13; i++) {
      const f = 1 - i / 13;
      const rx = 38 * f + 1.2, ry = 46 * f + 1.2;
      const cx = 50 + (1 - f) * 2.5, cy = 50 + (1 - f) * 1.5;
      const gapC = Math.PI / 2 + (rnd() - 0.5) * 0.44, gapW = 0.5 + rnd() * 0.25;
      const a1 = gapC + gapW / 2;
      const jitter = rnd() * 0.3;
      const breakAt = rnd() * TAU;
      let d = '', pen = false;
      for (let k = 0; k <= 110; k++) {
        const t = a1 + (k / 110) * (TAU - gapW);
        let rel = t - breakAt;
        while (rel < 0) rel += TAU;
        while (rel >= TAU) rel -= TAU;
        if (i % 3 === 1 && rel < 0.07) { pen = false; continue; }

        const p = rot(cx + rx * wob * Math.cos(t), cy + ry * wob * Math.sin(t));

    return anneaux.join(' ');

  // Emblème propre à chaque contact, calculé une fois à partir de l’empreinte commune aux deux identités.

  function statutReprise(c) {

  // Recherche et zones : outils partagés par l’accueil et « Nouveau message ».
  // Un contact garde la date de son dernier message, même quand le message lui-même est effacé.
  function marqueConversation(cid, ts) {
    const cs = contacts();
    const c = cs.find((x) => x.cid === cid);
    if (!c) return;
    c.lastMsg = Math.max(c.lastMsg || 0, ts || Date.now());
    LS.set('contacts', cs);
  }
  // Date du dernier message de chaque contact : messages encore là, ou date gardée sur le contact.
  function dernierMessageParContact(cs, ms) {
    const dernier = {};
    ms.forEach((m) => { if ((m.ts || 0) > (dernier[m.cid] || 0)) dernier[m.cid] = m.ts || 0; });
    cs.forEach((c) => { if ((c.lastMsg || 0) > (dernier[c.cid] || 0)) dernier[c.cid] = c.lastMsg; });
    return dernier;
  }
  // Recherche de contact : sans majuscules ni accents.
  function normaliser(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  // Filtre les lignes déjà affichées, sans redessiner l’écran : le clavier reste ouvert pendant la frappe.
  function appliquerRecherche() {
    const champ = document.getElementById('recherche');
    if (!champ) return;
    const q = normaliser(champ.value);
    let visibles = 0;
    document.querySelectorAll('[data-cherche]').forEach((el) => {
      const ok = !q || el.getAttribute('data-cherche').indexOf(q) >= 0;
      el.hidden = !ok;
      if (ok) visibles++;
    });
    document.querySelectorAll('[data-zone]').forEach((z) => { z.hidden = !z.querySelector('[data-cherche]:not([hidden])'); });
    const vide = document.getElementById('recherche-vide');
    if (vide) vide.hidden = !(q && visibles === 0);

  // Fiche de contact (vCard) : le téléphone propose de l'ajouter à son répertoire.
  function saveContactFile(cid) {
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return;
    const txt = (v) => String(v || '').replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\r?\n/g, ' ');
    const vcf = 'BEGIN:VCARD\r\nVERSION:3.0\r\nFN:' + txt(c.name) + '\r\nNOTE:Pli Scellé : ' + txt(c.pseudo) + '\r\nEND:VCARD\r\n';
    const url = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = String(c.name || 'contact').replace(/[\\\/:*?"<>|]/g, '') + '.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flashNow({ t: 'Fiche créée. Ouvrez-la pour l’ajouter à vos contacts.', ok: true });
  }

  async function pickContactName() {

  // Noms des fiches d’un fichier .vcf : le fichier est lu sur cet appareil, rien n’est envoyé.
  function parseVcardNames(text) {
    const lignes = String(text || '').replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n');
    const val = (s) => s.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();
    const noms = [];
    let fn = '', nom = '';
    for (const ligne of lignes) {
      const i = ligne.indexOf(':');
      if (i < 0) continue;
      const cle = ligne.slice(0, i).split(';')[0].split('.').pop().toUpperCase();
      const v = ligne.slice(i + 1);
      if (cle === 'BEGIN') { fn = ''; nom = ''; }
      else if (cle === 'FN' && !fn) fn = val(v);
      else if (cle === 'N' && !nom) { const p = v.split(';'); nom = [p[1], p[0]].map((x) => val(x || '')).filter(Boolean).join(' '); }
      else if (cle === 'END') { const titre = (fn || nom).slice(0, 40); if (titre) noms.push(titre); fn = ''; nom = ''; }
    }
    return noms;
  }

      const liste = $('#vcardlist');
      if (!noms.length) setStatus('formstatus', 'err', 'Aucun contact trouvé dans ce fichier.');
      else if (noms.length === 1) {

  // ---------- sauvegarde chiffrée : le fichier reste entre vos mains ----------
  async function sealWithCode(code, obj) {
    const salt = rand(16), iv = rand(12);
    const kb = await pbkdf2(code, salt, ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj))));
    return JSON.stringify({ pli: 1, s: b64u(salt), i: b64u(iv), c: b64u(ct) }, null, 1);
  }
  async function openWithCode(code, text) {
    let box = null;
    try { box = JSON.parse(text); } catch (e) { box = null; }
    if (!box || box.pli !== 1 || !box.s || !box.i || !box.c) throw new Error('Ce fichier n’est pas une sauvegarde Pli Scellé.');
    const kb = await pbkdf2(code, unb64u(box.s), ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    let pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(box.i) }, key, unb64u(box.c)); }
    catch (e) { throw new Error('Code secret incorrect, ou sauvegarde abîmée.'); }
    return JSON.parse(dec.decode(pt));
  }
  // Sauvegarde des contacts : pour chaque lien, l’adresse de la personne, l’ancienne adresse et la clé du lien. Jamais la clé de votre identité.
  async function backupPayloadV2() {
    const liste = [];
    for (const c of contacts()) {
      const lien = c.pend ? { old: c.pend.old, lk: c.pend.lk } : { old: S.me.raw, lk: b64u(await sharedBits(c.raw)) };
      liste.push({ name: c.name, pseudo: c.pseudo || '', raw: c.raw, label: c.label, since: c.since, old: lien.old, lk: lien.lk });
    }
    return { v: 2, at: Date.now(), contacts: liste };
  }
  function validContacts(o) {
    return !!o && o.v === 2 && Array.isArray(o.contacts) && o.contacts.every((c) => c && typeof c.raw === 'string' && typeof c.old === 'string' && typeof c.lk === 'string' && c.raw.length > 40 && c.old.length > 40 && c.lk.length > 20);
  }

  function go(screen, arg) {

    if (screen !== 'scanner') { S.scanKind = null; S.scanText = ''; S.scanLink = false; }

  // Code secret : au moins 8 caractères, lettres et chiffres mélangés, 32 au maximum.
  // Refusé : une suite ou une répétition de 4 caractères (1234, abcd, aaaa).
  function suiteOuRepetition(c) {
    const v = String(c).toLowerCase().split('').map((x) => x.charCodeAt(0));
    for (let i = 0; i + 3 < v.length; i++) {
      const a = v[i], b = v[i + 1], d = v[i + 2], e = v[i + 3];
      const monte = b === a + 1 && d === b + 1 && e === d + 1;
      const descend = b === a - 1 && d === b - 1 && e === d - 1;
      const meme = a === b && b === d && d === e;
      if (monte || descend || meme) return true;
    }
    return false;
  }

    if (c.length < 8) return 'Le code secret compte au moins 8 caractères.';
    if (c.length > 32) return 'Le code secret compte 32 caractères au maximum.';
    if (!/^[A-Za-z0-9]+$/.test(c)) return 'Le code secret ne contient que des lettres sans accent et des chiffres.';
    if (!/[A-Za-z]/.test(c) || !/[0-9]/.test(c)) return 'Mélangez des lettres et des chiffres.';
    if (suiteOuRepetition(c)) return 'Trop simple : 4 caractères qui se suivent ou se répètent.';

  // ---------- verrouillage : erreurs, délais, messages reçus effacés, code oublié, code d’urgence, activité ----------

  function attenteRestante() { return Math.max(0, Math.ceil((etatVerrou().attente - Date.now()) / 1000)); }
  function dureeAttente(s) { return s >= 60 ? Math.floor(s / 60) + ' min' + (s % 60 ? ' ' + (s % 60) + ' s' : '') : s + ' s'; }
  function surveillerAttente() {
    if (minuteurAttente) { clearInterval(minuteurAttente); minuteurAttente = null; }
    if (attenteRestante() <= 0) return;
    minuteurAttente = setInterval(() => {
      const reste = attenteRestante();
      if (reste > 0) { const el = $('#compte-attente'); if (el) el.textContent = dureeAttente(reste); return; }
      clearInterval(minuteurAttente); minuteurAttente = null;
      if (S.screen === 'verrouille') render();
    }, 1000);
  }
  async function codeCorrect(wrap, code) { try { await unwrapPkcs8(wrap, code); return true; } catch (e) { return false; } }
  // Une erreur de code : au deuxième, l’appli prévient ; au troisième, les messages reçus sont effacés, puis un délai.
  async function echecCode() {
    const v = etatVerrou();
    v.n += 1;
    if (v.n < 3) { LSG.set('verrou', v); S.verrouMessage = 'Ce code ne correspond pas. Essai ' + v.n + ' sur 3.'; return go('verrouille'); }
    v.n = 0; v.blocs += 1; v.attente = Date.now() + 30000 * Math.pow(2, v.blocs - 1); v.efface = true;
    LSG.set('verrou', v);
    S.verrouMessage = 'Trois erreurs : attendez avant de réessayer.';
    go('verrouille');
    await effacerMessagesRecus();
    if (S.screen === 'verrouille') render();
  }
  // Efface les messages reçus : sur ce téléphone, et sur le relais tant qu’ils n’ont pas été téléchargés. Les contacts restent.
  // Sur toutes les identités de l’appareil : leurs messages reçus sont effacés, ici et sur le relais.
  async function effacerMessagesRecus() {
    const avant = S.me, ouverte = idActif;
    for (const id of IDENTITES.filter(presente)) {
      idActif = id; S.me = LS.get('me', null);
      LS.set('msgs', msgsAll().filter((m) => m.dir !== 'in'));
      await viderVoixRecues();
      try { if (S.me && S.me.secret) await purgerRelais(true); } catch (e) { /* hors ligne : le relais sera vidé plus tard */ }
    }
    idActif = ouverte; S.me = avant;
  }
  async function viderVoixRecues() {
    try {
      const db = await vdb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(['audio', 'parts'], 'readwrite');
        tx.objectStore('audio').clear(); tx.objectStore('parts').clear();
        tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
      });
    } catch (e) { /* rien à effacer */ }
  }
  // Supprime sur le relais les messages non téléchargés. Avec « seulementMessages », les autres (lien, reprise) restent.
  async function purgerRelais(seulementMessages) {
    const boite = await mailboxOf(S.me.raw);
    for (let tour = 0; tour < 20; tour++) {
      const rows = await rpc('pli_fetch', { p_mailbox: boite, p_secret: S.me.secret });
      if (!rows || !rows.length) return;
      let retires = 0;
      for (const r of rows) {
        const k = (r.msg_payload || {}).kind;
        if (seulementMessages && k !== 'msg' && k !== 'voicepart') continue;
        await rpc('pli_ack', { p_id: r.msg_id, p_mailbox: boite, p_secret: S.me.secret });
        retires++;
      }
      if (retires === 0 || rows.length < 200) return;
    }
  }
  // Code d’urgence de la première identité : tout l’appareil est effacé, la seconde comprise, sans rien afficher.
  async function effacementUrgence() {
    for (const id of IDENTITES.filter(presente)) { idActif = id; S.me = LS.get('me', null); await effacerIdentite(false, true); }
    idActif = 'a';
    S.priv = null; S.autre = null; S.verrouMessage = null; S.flash = null;
    go(presente('a') ? 'verrouille' : 'creer');
  }
  // Code oublié : compte à rebours de 5 secondes, puis l’identité est effacée (contacts prévenus).
  function arreterDecompteOublie() { if (decompteOublie) { clearInterval(decompteOublie); decompteOublie = null; } }
  function demarrerDecompteOublie() {
    arreterDecompteOublie();
    valeurOublie = 5;
    decompteOublie = setInterval(async () => {
      valeurOublie -= 1;
      if (valeurOublie > 0) { if (S.screen === 'codeoublie-decompte') render(); return; }
      arreterDecompteOublie();
      const ok = await effacerTout();
      if (ok) { S.verrouMessage = null; S.flash = null; return go('creer'); }
      S.verrouMessage = (S.flash && S.flash.t) || 'Rien n’a été effacé. Réessayez en ligne.';
      go('verrouille');
    }, 1000);
  }
  async function actEnregistrerUrgence() {
    const actuel = ($('#uact') || {}).value || '', u1 = ($('#u1') || {}).value || '', u2 = ($('#u2') || {}).value || '';
    if (!await codeCorrect(S.me.wrap, actuel)) return setStatus('formstatus', 'err', 'Code secret incorrect.');
    const erreur = erreurCodeSecret(u1);
    if (erreur) return setStatus('formstatus', 'err', erreur);
    if (u1 !== u2) return setStatus('formstatus', 'err', 'Les deux codes d’urgence ne sont pas identiques.');
    if (await codeCorrect(S.me.wrap, u1)) return setStatus('formstatus', 'err', 'Ce code est votre code secret. Choisissez-en un autre.');
    if (await codeDejaUtilise(u1, idActif)) return setStatus('formstatus', 'err', 'Ce code est déjà le code secret de votre autre identité. Choisissez-en un autre.');
    const pkcs8 = await unwrapPkcs8(S.me.wrap, actuel);
    LS.set('urgence', await wrapPkcs8(pkcs8, u1));
    S.flash = { t: 'Code d’urgence enregistré.', ok: true };
    go('identite');
  }
  function actSupprimerUrgence() { LS.set('urgence', null); S.flash = { t: 'Code d’urgence supprimé.', ok: true }; go('identite'); }
  async function wrapPkcs8(pkcs8, code) {
    const salt = rand(16), iv = rand(12);
    const kb = await pbkdf2(code, salt, ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, pkcs8));
    return { salt: b64u(salt), iv: b64u(iv), ct: b64u(ct) };
  }
  // Verrouillage automatique : trois minutes sans toucher l’écran.
  function verifierInactivite() {
    if (!S.priv || !S.me) return;
    if (Date.now() - derniereAction < 180000) return;
    S.verrouMessage = null;
    verrouiller();
  }
  // Verrouille l’appli. Seule la première identité se rouvre, avec son code. Une seconde ouverte se referme avec la session.
  async function verrouiller() {
    if (S.changement) return;
    S.changement = true;
    stopPolling();
    try {
      await attendreFinSynchro();   // la lecture en cours finit dans l’identité qui la faisait
      S.priv = null; S.autre = null;
      idActif = 'a'; S.me = LS.get('me', null);
    } finally { S.changement = false; }
    go('verrouille');
  }
  // Ouvre l’identité dont le code est donné, parmi celles-ci. Une identité ne se lit que si son code correspond.
  async function ouvrirAvecCode(code, ids) {
    for (const id of ids) {
      idActif = id;
      const me = LS.get('me', null);
      if (!me) continue;
      try { S.priv = await unwrapPriv(me.wrap, code); S.me = me; return true; } catch (e) { /* ce n’est pas celle-ci */ }
    }
    idActif = 'a'; S.priv = null;
    return false;
  }
  // Un code ne doit ouvrir qu’une seule identité : on le refuse s’il ouvre déjà une autre identité de cet appareil.
  async function codeDejaUtilise(code, sauf) {
    const ouverte = idActif, avant = S.me;
    let trouve = false;
    for (const id of IDENTITES.filter(presente)) {
      if (id === sauf) continue;
      idActif = id;
      const me = LS.get('me', null);
      if (me && await codeCorrect(me.wrap, code)) { trouve = true; break; }
    }
    idActif = ouverte; S.me = avant;
    return trouve;
  }
  async function actUnlock() {
    if (attenteRestante() > 0) return;
    const code = $('#unlock').value;
    if (!code) return;
    S.verrouMessage = null;
    // Seule la première identité s’ouvre ici. La seconde ne se trouve que depuis « Mon identité ».
    if (presente('a') && await ouvrirAvecCode(code, ['a'])) {
      if (!await ensureSecret()) { S.priv = null; S.verrouMessage = 'Cette identité ne peut plus être ouverte ici : sa boîte est déjà prise. Créez une nouvelle identité.'; return go('verrouille'); }
      LSG.set('verrou', VERROU_DEFAUT);   // bon code : les compteurs repartent de zéro
      return afterAuth();
    }
    // Code d’urgence de la première identité : tout l’appareil est effacé, la seconde comprise.
    idActif = 'a';
    const urgence = LS.get('urgence', null);
    if (urgence && await codeCorrect(urgence, code)) return effacementUrgence();

  function afterAuth() {

  async function actSendFF() {

  // Image du QR code en PNG (fond blanc), pour être scannée par une caméra.
  function qrPngBlob() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const g = c.getContext('2d');
        g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('png'))), 'image/png');
      };
      img.onerror = () => reject(new Error('image'));
      img.src = S.invQR;
    });
  }
  // Une image n’est pas cliquable dans une messagerie : le lien part donc en texte, sur sa propre ligne (cliquable partout),
  // et l’image du QR code part avec lui quand le téléphone sait partager des fichiers.
  async function actShareLink(id) {
    const inv = invitesAll().find((i) => i.id === id);
    if (!inv) return;
    const lien = invTextFor(inv);
    const texte = 'Ajoutez-moi sur Pli Scellé. Touchez ce lien pour m’envoyer une demande :\n' + lien;
    if (navigator.share) {
      let fichiers = [];
      try { if (S.invQR) fichiers = [new File([await qrPngBlob()], 'invitation-pli-scelle.png', { type: 'image/png' })]; } catch (e) { fichiers = []; }
      const avecImage = fichiers.length > 0 && !!navigator.canShare && navigator.canShare({ files: fichiers });
      try {
        await navigator.share(avecImage ? { files: fichiers, title: 'Pli Scellé', text: texte } : { title: 'Pli Scellé', text: texte });
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }

    copyText(lien, 'Lien copié. Collez-le dans la messagerie de votre choix.');
  }

  // Les mots touchés par l’invitée sont comparés aux siens : les deux listes viennent des deux clés.

  // Toucher un message ouvert le referme tout de suite : en lecture unique il est effacé, en relisible il redevient une tuile.
  function actFermerMessage(mid) {
    const all = msgsAll();
    const m = all.find((x) => x.mid === mid);
    if (!m || m.state !== 'open' || m.kind === 'voice') return;
    if (m.once === false) { m.state = 'new'; m.until = 0; }
    else { m.state = 'gone'; m.goneAt = Date.now(); m.text = ''; }
    LS.set('msgs', all);
    go('conv', S.arg);
  }
  function actReveal(mid) {
    const all = msgsAll();
    const m = all.find((x) => x.mid === mid);
    if (m && m.state === 'new') { m.state = 'open'; m.seen = true; m.until = Date.now() + dureeLecture(m.cid); LS.set('msgs', all); }
    go('conv', S.arg);
  }
  async function actCut(cid) {
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return go('accueil');
    try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) {}
    removeContact(cid);
    S.cut = { name: c.name || c.pseudo };   // le nom donné à ce contact, pas son pseudo
    go('lien-coupe');
  }
  // Supprimer l’identité : avec « keep », les contacts sont mis en pause (ils pourront reprendre le lien) ; sinon, les liens sont coupés.
  // Efface l’identité. Avec « keep », les contacts sont mis en pause ; sinon ils reçoivent une coupure vérifiée par le serveur.
  // Renvoie false si un contact n’a pas pu être prévenu : rien n’est effacé, sauf si on force (code d’urgence).
  // Efface l’identité ouverte, et elle seule. « keep » garde les contacts en pause ; sinon ils reçoivent la coupure.
  async function effacerIdentite(keep, forcer) {
    if (keep === true) {
      for (const c of contacts()) { try { await sendAuth(c.raw, 'pause', { ts: Date.now() }); } catch (e) {} }
    } else {
      const echecs = [];
      for (const c of contacts()) { try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) { echecs.push(c.name || c.pseudo || 'un contact'); } }
      if (echecs.length && !forcer) { S.flash = { t: 'Rien n’a été effacé : impossible de prévenir ' + echecs.join(', ') + '. Réessayez en ligne.', ok: false }; return false; }
    }
    try { await purgerRelais(false); } catch (e) { /* hors ligne */ }
    for (const i of invitesAll()) { if (i.status === 'open') await closeInviteDoc(i.id); }
    stopPolling(); await attendreFinSynchro();   // la lecture en cours finit avant que les données ne soient effacées
    effacerDonneesIdentite(idActif);
    S.me = null; S.priv = null; S.qr = null; S.invQR = null; S.draftPseudo = null; S.words = null;
    stopPolling();
    return true;
  }
  // Supprime tout ce qui appartient à une identité : réglages, contacts, messages, base vocale.
  // Le compteur d’erreurs est commun à l’appareil : il ne disparaît qu’avec la dernière identité.
  function effacerDonneesIdentite(id) {
    Object.keys(localStorage).filter((k) => k.indexOf('pli.' + id + '.') === 0).forEach((k) => localStorage.removeItem(k));
    try { indexedDB.deleteDatabase(nomVoix(id)); } catch (e) { /* rien à effacer */ }
    vdbP = null;
    const restantes = IDENTITES.filter(presente);
    if (restantes.length) LSG.set('ids', restantes);
    else { localStorage.removeItem('pli.verrou'); localStorage.removeItem('pli.ids'); }
  }
  // Code oublié : toutes les identités de l’appareil sont effacées. Avant, on vérifie que tous les contacts seront prévenus :
  // si l’un d’eux ne peut pas l’être, rien n’est effacé.
  async function effacerTout() {
    const ids = IDENTITES.filter(presente);
    const avant = S.me, ouverte = idActif;
    for (const id of ids) {
      idActif = id; S.me = LS.get('me', null);
      const echecs = [];
      for (const c of contacts()) { try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) { echecs.push(c.name || c.pseudo || 'un contact'); } }
      if (echecs.length) {
        idActif = ouverte; S.me = avant;
        S.flash = { t: 'Rien n’a été effacé : impossible de prévenir ' + echecs.join(', ') + '. Réessayez en ligne.', ok: false };
        return false;
      }
    }
    for (const id of ids) {
      idActif = id; S.me = LS.get('me', null);
      try { await purgerRelais(false); } catch (e) { /* hors ligne */ }
      for (const i of invitesAll()) { if (i.status === 'open') await closeInviteDoc(i.id); }
      effacerDonneesIdentite(id);
    }
    idActif = 'a'; S.me = null; S.priv = null; S.autre = null; S.qr = null; S.invQR = null; S.draftPseudo = null; S.words = null;
    stopPolling();
    return true;
  }
  async function actDeleteMe(keep) {
    if (idActif === 'b') return actEffacerCetteIdentite();   // « mon identité » désigne l’agent double : lui seul est effacé
    if (idActif !== 'a') return;   // la suppression vise toujours la première identité
    if (await effacerIdentite(keep) === false) return go('identite');
    // La seconde est reliée à la première : elle est effacée avec elle.
    if (presente('b')) await effacerSeconde();
    S.autre = null;
    idActif = 'a';
    go(presente('a') ? 'verrouille' : 'creer');
  }

  async function actMakeBackup() {
    const code = $('#bcode').value || '';
    if (!code) return setStatus('formstatus', 'err', 'Entrez votre code secret.');
    try { await unwrapPriv(S.me.wrap, code); } catch (e) { return setStatus('formstatus', 'err', 'Code secret incorrect.'); }
    const text = await sealWithCode(code, await backupPayloadV2());
    if (S.downloads) {
      try {
        await S.downloads.save({ filename: 'pli-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', data: enc.encode(text) });
        LS.set('lastBackup', Date.now()); S.backupText = null; S.backupDone = true;
        go('sauvegarde');
        return flashNow({ t: 'Sauvegarde enregistrée. Gardez ce fichier en lieu sûr.', ok: true });
      } catch (e) {
        if (e && e.code === 'declined') return setStatus('formstatus', 'info', 'Enregistrement annulé.');
      }
    }
    // Le fichier est prêt : l’écran propose ensuite de l’enregistrer. Rien n’est marqué comme fait ici.
    S.backupText = text; S.backupDone = false; S.backupMessage = null;
    go('sauvegarde');
  }
  // Enregistrer le fichier : le menu de partage propose « Enregistrer dans Fichiers ». Rien n’est marqué sans enregistrement réel.
  async function actEnregistrerFichier() {
    if (!S.backupText) return;
    const nom = 'pli-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      if (S.downloads) {
        await S.downloads.save({ filename: nom, data: enc.encode(S.backupText) });
      } else {
        const fichier = new File([enc.encode(S.backupText)], nom, { type: 'application/json' });
        if (!(navigator.share && navigator.canShare && navigator.canShare({ files: [fichier] }))) {
          S.backupMessage = { kind: 'info', text: 'Ce téléphone ne permet pas d’enregistrer le fichier ici. Utilisez « Je n’arrive pas à enregistrer le fichier ».' };
          return go('sauvegarde');
        }
        await navigator.share({ files: [fichier], title: 'Sauvegarde Pli Scellé' });
      }
      LS.set('lastBackup', Date.now()); S.backupDone = true;
      S.backupText = null;   // le fichier est enregistré : plus de « Fichier prêt », plus de bouton « Enregistrer »
      S.backupMessage = { kind: 'ok', text: 'Fichier enregistré dans vos fichiers. Il est prêt à être utilisé.' };
    } catch (e) {
      const annule = e && (e.name === 'AbortError' || e.code === 'declined');
      S.backupMessage = { kind: 'info', text: annule ? 'Enregistrement annulé. Vous pouvez aussi copier le texte.' : 'Le fichier n’a pas pu être enregistré. Vous pouvez copier le texte.' };
    }
    go('sauvegarde');
  }
  // Installer la sauvegarde des contacts : ils apparaissent « À réactiver » jusqu’à la réponse de chaque personne.
  async function actInstall() {
    const code = $('#rcode').value || '';
    const text = ($('#rtext').value || '').trim();
    if (!text) return setStatus('formstatus', 'err', 'Choisissez le fichier de sauvegarde.');
    if (!code) return setStatus('formstatus', 'err', 'Entrez le code secret de la sauvegarde.');
    let o;
    try { o = await openWithCode(code, text); } catch (e) { return setStatus('formstatus', 'err', e.message); }
    if (!validContacts(o)) return setStatus('formstatus', 'err', 'Cette sauvegarde ne peut pas être installée. Refaites-la avec la version actuelle de l’appli.');
    let n = 0;
    for (const item of o.contacts) {
      if (contacts().some((c) => c.raw === item.raw)) continue;
      const c = addContact(item.raw, String(item.pseudo || ''), String(item.name || item.pseudo || 'Contact').slice(0, 40));
      const all = contacts(); const x = all.find((y) => y.cid === c.cid);
      if (x) x.pend = { old: item.old, lk: item.lk };
      LS.set('contacts', all);
      n++;
    }
    S.flash = { t: n ? (n + (n > 1 ? ' contacts installés' : ' contact installé') + '. Touchez « Réactiver les liens » dans l’accueil.') : 'Ces contacts sont déjà dans votre liste.', ok: true };
    go('accueil');
  }
  // Envoie la demande de reprise à chaque contact en attente. Le lien revient quand la personne répond.
  async function actReactivate() {
    let envoyes = 0;
    for (const c of contacts().filter((x) => x.pend)) {
      try {
        await sendReprise(c);
        // La demande est partie : la personne confirme dans son appli.
        const all = contacts(); const x = all.find((y) => y.cid === c.cid);
        if (x && x.pend) { x.pend.envoyee = Date.now(); delete x.pend.refus; LS.set('contacts', all); }
        envoyes++;
      } catch (e) { /* réessayé au prochain appui */ }
    }
    render();
    flashNow({ t: envoyes ? 'Demande envoyée. Chaque lien revient quand la personne a confirmé dans son appli.' : 'Envoi impossible pour l’instant. Réessayez.', ok: envoyes > 0 });
  }

    plusloc: (cid) => {

  // Sur l’agent double, ces actions s’affichent mais n’ont aucun effet : rien n’est activé, rien n’est sauvegardé, rien ne sort du téléphone.
  const ACTS_SANS_EFFET_SUR_LE_DOUBLE = new Set(['enablebio', 'disablebio', 'biounlock', 'create', 'ajouterverifier', 'install', 'reactiver', 'deletekeep', 'urgenceenregistrer', 'urgencesupprimer', 'backup', 'copybackup', 'enregistrerfichier']);
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    ev.preventDefault();
    if (idActif === 'b' && ACTS_SANS_EFFET_SUR_LE_DOUBLE.has(el.dataset.act)) return;
    const fn = ACTS[el.dataset.act];
    if (!fn) return;
    el.disabled = true;
    Promise.resolve().then(() => fn(el.dataset.arg)).catch((err) => { console.warn('Pli', err); setStatus('formstatus', 'err', errText(err)); })
      .finally(() => { if (el.isConnected) el.disabled = false; });
  });
  // Photo prise avec l’appareil : lecture du QR code, puis vérification du type.
  // Texte lu (photo ou caméra) : il est rangé dans le formulaire, puis le code est demandé.

  function scanMsg(kind, text) {
    setStatus('scanstatus', kind, text);
    const st = $('#scanstatus');
    if (st) { st.classList.add('big'); st.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
  // Un QR code lu (photo ou appareil photo) : l’appli reconnaît seule l’invitation ou l’identité.
  async function handleScan(txt) {
    const t = String(txt || '').trim();
    let kind = null;
    if (isInvText(t)) kind = 'inv';
    else if (t.indexOf('PLI1:') === 0 || /#ff-/.test(t)) kind = 'ff';
    if (!kind) return scanMsg('err', 'Ce QR code n’est pas celui de Pli Scellé.');
    if (kind === 'ff') { try { parseQR(t); } catch (e) { return scanMsg('err', e.message); } }
    S.scanKind = kind; S.scanText = t; S.scanLink = false;
    const box = $('#qrtext'); if (box) box.value = t;
    scanMsg('ok', kind === 'inv' ? 'Invitation lue. Envoyez votre demande.' : 'Identité lue. Entrez maintenant le code affiché sur son écran.');
  }
  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    if (!t || !['photo', 'photogal'].includes(t.id) || !t.files || !t.files[0]) return;
    scanMsg('ok', 'Lecture de la photo…');
    try { await handleScan(await decodeFile(t.files[0])); }
    catch (e) { scanMsg('err', e.message); }
    t.value = '';

  document.addEventListener('change', async (ev) => {

  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopVoice(true); arreterParArriere(); } else { poll(); verifierVersion(); } });

  function tick() {
    const cd = document.getElementById('cd');
    const d = LS.get('display', null);
    if (cd && d) {
      const s = Math.max(0, Math.round((d.exp - Date.now()) / 1000));
      cd.textContent = Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s';
    }
    document.querySelectorAll('audio[data-voice]').forEach((a) => { if (!a.paused && !a.ended) keepVoiceOpen(a.dataset.voice); });
    if (expireOpened() && S.screen === 'conv') render();
    document.querySelectorAll('[data-until]').forEach((el) => {
      const s = Math.max(0, Math.ceil((Number(el.dataset.until) - Date.now()) / 1000));
      el.textContent = 'Se referme dans ' + s + ' s';
    });
  }
  setInterval(tick, 1000);

  // ---------- alertes : sonnerie à la réception (facultative, réglée dans « Mon identité ») ----------
  function getPrefs() { const p = LS.get('prefs', null) || {}; return { sound: !!p.sound, tone: (p.tone && TONES[p.tone]) ? p.tone : 'pli', notif: !!p.notif, push: !!p.push }; }
  function setPref(k, v) { LS.set('prefs', Object.assign(getPrefs(), { [k]: v })); }
  // Son : un seul contexte audio à la fois (iOS en limite le nombre). Un contexte fermé ne reprend jamais : alors on en crée un autre.
  // iOS le suspend hors d’un toucher : on le reprend à chaque toucher, ce qui est le seul moment où il accepte le son.
  let ctxSon = null;
  function sonContexte() {
    if (ctxSon && ctxSon.state === 'closed') ctxSon = null;
    if (!ctxSon) { try { ctxSon = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxSon = null; } }
    return ctxSon;
  }
  function sonPret() { const c = sonContexte(); return !!c && c.state === 'running'; }
  function touchSon() {

      if (!appui || idActif !== 'b' || !S.autre) { appuis = 0; ancre = null; return; }
      // Les trois appuis doivent tomber au même endroit (à 40 px près) : tapoter partout ne ferme pas la seconde.
      const meme = ancre && Math.hypot(e.clientX - ancre.x, e.clientY - ancre.y) < 40 && maintenant - dernierAppui < 900;
      appuis = meme ? appuis + 1 : 1;
      if (appuis === 1) ancre = { x: e.clientX, y: e.clientY };
      dernierAppui = maintenant;
      if (appuis < 3) return;
      appuis = 0;
      avalerClic = maintenant + 700;
      fermerSeconde();
    }, true);
    document.addEventListener('click', (e) => {
      if (Date.now() > avalerClic) return;
      avalerClic = 0; e.stopPropagation(); e.preventDefault();
    }, true);
    if (!S.me) return go('creer', S.inviteId ? 'invite' : null);
    return go('verrouille', S.inviteId ? 'invite' : null);
  }
  init().catch((e) => { console.error(e); $('#app').innerHTML = '<div class="screen">' + notice('err', 'Erreur au démarrage : ' + esc(e.message)) + '</div>'; });
})();
</script>
