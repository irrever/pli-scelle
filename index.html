<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pli Scellé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#10233A;--ink-2:#33475C;--muted:#5B6B7D;--line:#D3DAE2;--line-2:#E3E8EE;--accent:#0B6B5C;--on-accent:#FFFFFF;--accent-soft:#DDEFEA;--warn:#8A5200;--warn-soft:#FBEFD9;--danger:#B3261E;--danger-soft:#F9E3E1;--id-bg:#10233A;--id-ink:#E6EDF4;--id-muted:#9FB0C3;--id-accent:#9FD8C9;--shadow:0 1px 2px rgba(16,35,58,.06),0 6px 18px rgba(16,35,58,.06);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:460px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding:0 0 16px;animation:in .22s ease both}
#app.meme-ecran .screen{animation:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.spinner{animation:none}}
h1{margin:0;font:600 26px/1.2 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:600 17px/1.3 "Bricolage Grotesque",system-ui,sans-serif}
p{margin:0}
.lead{color:var(--muted);font-size:15px}
.hint{color:var(--muted);font-size:15px;line-height:1.45}
.center{text-align:center;align-items:center}
.center-col{align-items:center;text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-title{font-weight:600;font-size:16px}
.row-sub{color:var(--muted);font-size:15px}
.section-title{font:600 15px/1.3 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink-2);margin:20px 4px 8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.code{font:600 34px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;color:var(--ink)}
.code-sm{font:600 15px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em}
.code-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
.ico{width:20px;height:20px;flex:none}
/* barre du haut */
.topbar{position:relative;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px 8px 8px;background:var(--bg)}
.topbar-title{flex:1;min-width:0;font:600 17px/1.2 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.topbar.bare{padding-left:0}
.topbar-right{display:flex;align-items:center;gap:4px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface)}
.iconbtn .ico{width:22px;height:22px}
.iconbtn-ph{width:44px;height:44px;flex:none}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost{background:transparent;color:var(--accent);min-height:40px;width:auto;padding:0 10px;border-radius:10px}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn .ico{width:18px;height:18px}
.dock{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
/* cartes et listes */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.form{gap:8px}
.label{font-size:15px;font-weight:600;color:var(--ink-2);margin-top:4px}
.field{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{resize:vertical;min-height:72px;font-size:16px;line-height:1.4}
.code-input{font:600 22px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.input-row{display:flex;gap:8px;align-items:stretch}
.input-row .field{flex:1;min-width:0}
.btn-inline{width:auto;min-height:50px;padding:0 14px;border-radius:12px}
.list{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line-2);background:transparent;text-align:left;cursor:pointer;color:var(--ink)}
.row-item[hidden]{display:none}
.row-item:first-child{border-top:0}
.row-item:hover{background:var(--surface-2)}
.row-item.is-off{cursor:default}
.row-item.is-off:hover{background:transparent}
.row-item.is-off .avatar{background:var(--surface-2);color:var(--muted)}
.row-item.is-off .row-title{color:var(--muted)}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-text .row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 16px;border:0;border-top:1px solid var(--line-2);background:transparent;color:var(--ink);font-weight:500;text-align:left;cursor:pointer}
.tarif{display:inline-flex;align-items:center;margin-left:auto;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tarif.acquis{background:transparent;color:var(--muted);border:1px solid var(--line-2);font-weight:500}
.tarif.paye{background:var(--accent);color:var(--on-accent);font-weight:600}
.rowlink .row-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.rowlink:first-child{border-top:0}
.rowlink.danger{color:var(--danger)}
.rowlink .state{margin-left:auto;font-size:16px;font-weight:400;color:var(--muted)}
.rowlink .ico{width:18px;height:18px}
.rico{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.rico.warn{background:var(--warn-soft);color:var(--warn)}
.rico.danger{background:var(--danger-soft);color:var(--danger)}
.rico .ico{width:20px;height:20px}
.rico + span{flex:1;min-width:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--line)}
.choice-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.choice-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.choice-text b{font-size:16px;font-weight:600}
.choice-text span{color:var(--muted);font-size:15px;line-height:1.4}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 17px "Bricolage Grotesque",system-ui,sans-serif;flex:none}
.avatar.lg{width:56px;height:56px;font-size:21px}
.avatar.xl{width:76px;height:76px;font-size:30px}
.count{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--accent-soft);color:var(--accent)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:600;text-align:left;cursor:pointer}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice .ico{width:22px;height:22px}
.notice .grow{flex:1}
.notice .more{font-weight:500;font-size:15px;color:var(--ink-2)}
.notice.alert{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.notice.alert .more{color:rgba(255,255,255,.92)}
.status{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;font-size:16px;line-height:1.45}
.status[hidden]{display:none}
.flash{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:30;margin:0!important;box-shadow:var(--shadow);pointer-events:none}
.status-ok{background:var(--accent-soft);color:var(--accent)}
.status.big{font-size:17px;font-weight:600;padding:16px;border-radius:16px}
.status-info{background:var(--warn-soft);color:var(--warn)}
/* Conteneur des erreurs : il porte une alerte, sans fond rouge ni retrait */
.status.status-alerte{display:block;padding:0;border-radius:0;background:none;color:inherit;font-size:inherit;font-weight:inherit;line-height:inherit}
.alerte-seul{align-items:center}
.alerte-texte-seul{display:block;font-size:15px;font-weight:500;line-height:1.45;color:var(--ink)}
/* Alerte : erreur présentée sobrement (titre, explication, progression des essais), sans bandeau rouge plein */
.alerte{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);text-align:left;animation:alerte-entree .24s ease-out both}
.alerte-corps{min-width:0}
.alerte-titre{display:block;font-size:16px;font-weight:600;line-height:1.3;color:var(--ink)}
.alerte-texte{display:block;margin-top:3px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.alerte-essais{display:flex;align-items:center;gap:6px;margin-top:12px}
.alerte-essais i{flex:1;height:4px;border-radius:999px;background:var(--line)}
.alerte-essais i.on{background:var(--danger)}
.alerte-compte{flex:none;margin-left:8px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
@keyframes alerte-entree{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.alerte{animation:none}}
/* Jauge du code secret : elle compte jusqu’au minimum, puis devient verte quand le code est valide */
.jauge{display:grid;gap:7px;margin:-4px 0 12px}
.jauge-barre{display:flex;gap:5px}
.jauge-barre i{flex:1;height:5px;border-radius:999px;background:var(--line);transition:background .2s ease}
.jauge-barre i.on{background:var(--ink-2)}
.jauge-barre i.attention{background:var(--warn)}
.jauge-barre i.ok{background:var(--accent)}
.jauge-ligne{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;line-height:1.35}
.jauge-texte{min-width:0;color:var(--muted)}
.jauge-compte{flex:none;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.jauge.attention .jauge-texte{color:var(--warn)}
.jauge.ok .jauge-texte,.jauge.ok .jauge-compte{color:var(--accent);font-weight:600}
/* Œil « maintenir pour voir » : à la création d’un code, le texte s’affiche tant que le doigt reste posé, puis redevient des points */
.champ-oeil{position:relative}
.champ-oeil .field{padding-right:54px}
.oeil{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.oeil .ico{width:22px;height:22px}
.oeil.actif{background:var(--accent-soft);color:var(--accent)}
.oeil:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Bloc de paiement d’une option : montant, solde et ce qui sera débité */
.paie{display:grid;gap:14px;padding:18px;border:1px solid var(--line-2);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.paie-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.paie-nom{display:grid;gap:3px;min-width:0}
.paie-nom b{font-size:16px;font-weight:600;color:var(--ink)}
.paie-nom span{font-size:14px;color:var(--muted)}
.paie-montant{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.paie-montant b{font-size:34px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.paie-montant .monnaie{font-size:16px;font-weight:600}
.paie-pastille{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;white-space:nowrap}
.paie-lignes{display:grid;border-top:1px solid var(--line-2)}
.paie-lignes>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:15px;color:var(--ink-2)}
.paie-lignes>div:last-child{border-bottom:0}
.paie-lignes b{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.paie-lignes b .monnaie{font-size:14px;font-weight:600}
.paie-lignes .manque span,.paie-lignes .manque b{color:var(--warn)}
.paie-lignes .zero b{color:var(--accent)}
.paie-note{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--accent)}
.empty b{color:var(--ink);font-weight:600}
/* QR et codes */
.qr-frame{align-self:center;background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.qr-frame img{display:block;width:min(336px,calc(100vw - 56px));height:auto;image-rendering:pixelated}
.code-card{align-items:center;text-align:center}
.code-card .row-between{width:100%}
.fallback{border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--surface);color:var(--ink-2)}
.fallback summary{cursor:pointer;font-weight:600;font-size:16px}
.fallback[open] summary{margin-bottom:10px}
.fallback .stack{margin-top:10px}
/* étapes */
.step-card{gap:12px}
.step-head{display:flex;align-items:center;gap:12px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px "IBM Plex Mono",ui-monospace,monospace;flex:none}
.step-n.done{background:var(--accent);color:var(--on-accent)}
.step-head b{font-size:15px;font-weight:600}
.file-btn{position:relative;cursor:pointer}
.progress{display:flex;flex-direction:column;gap:0}
.pstep{display:flex;gap:14px;align-items:flex-start;padding-bottom:18px;position:relative}
.pstep:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.pstep.done:not(:last-child)::before{background:var(--accent)}
.pstep .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;font:600 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.pstep.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pstep.now .dot{border-color:var(--accent);color:var(--accent)}
.pstep b{display:block;font-weight:600}
.pstep span{color:var(--muted);font-size:15px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
/* mots d’empreinte */
.words-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600}
.word-n{font:500 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);min-width:14px}
button.word{color:var(--ink);font:inherit;font-weight:600;text-align:left;width:100%;cursor:pointer}
.word.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.eyebrow{font:500 12px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* carte d’identité */
.id-card{background:var(--id-bg);color:var(--id-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(16,35,58,.25);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.id-qr{touch-action:none}
.visuellement-cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.id-top{display:flex;justify-content:space-between;font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--id-accent)}
.id-label{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--id-muted)}
.id-name{font:700 32px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.id-foot{font-size:15px;color:var(--id-muted);line-height:1.45}
.id-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.id-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.id-name{overflow-wrap:anywhere}
.id-qr{flex:none;width:min(88px,25vw)}
.id-qr .qr-build{width:100%;padding:5px;border-radius:8px}
/* marque et écrans d’état */
.brand{display:flex;align-items:center;gap:10px;padding-top:24px;font:600 16px "Bricolage Grotesque",system-ui,sans-serif}
.brand-mark{width:36px;height:36px;color:var(--accent)}
.hero-icon{width:76px;height:76px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;align-self:center}
.hero-icon.danger{background:var(--danger-soft);color:var(--danger)}
.hero-icon .ico{width:34px;height:34px}
.compte-rebours{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.cr-ring{position:relative;width:128px;height:128px}
.cr-ring svg{display:block}
.cr-chiffre{position:absolute;inset:0;display:grid;place-items:center;font:700 44px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--danger)}
.cr-titre{margin:0;font-weight:600;font-size:17px}
.contact-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:8px}
.conv-title{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
/* conversation */
.thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8px 0}

        const g = c.getContext('2d', { willReadFrequently: true });

  // Côté personne invitée : l’inviteur lui demande trois mots précis ; elle les touche sur son écran.
  async function onVerif(m) {

    if (idx < 0) return false;

  // Côté personne invitée : le code arrive dans l’appli, chiffré pour elle seule.

  // Côté personne qui invite : les mots touchés par l’invitée sont comparés aux siens. Rien n’est tapé.

  async function onMots(m) {
    const body = await decryptFrom(await sharedKey(m.from), m.iv, m.ct);
    const pend = pendingAll();
    const idx = pend.findIndex((p) => p.type === 'remote-claim' && p.invId === body.inv && p.peer === m.from);
    if (idx < 0) return false;
    const p = pend[idx];
    if ((body.niveau || 1) !== (p.niveau || 1)) return false;
    const mes = await wordsFor(unb64u(S.me.raw), unb64u(m.from));
    const demandes = (p.pos || []).slice().sort((a, b) => a - b);
    const recus = (body.mots || []).map((x) => x.p).sort((a, b) => a - b);
    const memesPositions = recus.length === demandes.length && recus.every((q, i) => q === demandes[i]);
    const bons = memesPositions && (body.mots || []).every((x) => normMot(x.m) === normMot(mes[x.p - 1]));

      await sendTo(m.from, { kind: 'mots-ok', inv: body.inv });
      S.needRender = true;
      return true;
    }
    if ((p.niveau || 1) === 1) {

  // Côté personne invitée : la personne qui invite a comparé les mots et les a confirmés. Il ne reste que le code à recevoir.
  async function onMotsOk(m) {

    const idx = pend.findIndex((p) => (p.type === 'remote-sent' || p.type === 'code') && p.invId === m.inv && p.peer === m.from);

    LS.set('pending', pend);

  // Côté personne qui invite : la personne prouve qu’elle a le code. Le contact est créé ici, puis l’acceptation part.
  async function onProof(m) {

    const avant = contacts().find((c) => c.raw === p.peer);
    const cProof = addContact(p.peer, p.peerPseudo, p.name);

    markInviteClosed(m.inv);
    if (S.screen === 'lien-ouvert' && S.arg === p.pid) go('contact', cProof.cid);
    // Posé après le changement d’écran : le message reste visible au rendu qui suit ce traitement (sinon le rendu du sondage l’efface).
    S.flash = avant ? { t: messageDejaLa(avant.name, p.name), ok: true } : { t: p.name + ' est ajoutée.', ok: true };

  async function onAccept(m) {

    if (idx < 0) return false;
    const p = pend[idx];
    pend[idx] = { pid: p.pid, at: Date.now(), type: p.type === 'ff-sent' ? 'ff-accepted' : 'remote-accepted', peer: m.from, peerPseudo: m.pseudo || 'Contact', invId: p.invId || null };
    LS.set('pending', pend);
    S.routed.delete(pend[idx].pid);
    return true;
  }
  async function onRefuse(m) {
    const pend = pendingAll();
    const idx = pend.findIndex((p) => (p.type === 'ff-sent' && p.peer === m.from) || ((p.type === 'remote-sent' || p.type === 'verif' || p.type === 'code') && p.invId === m.inv));

  // Liens reçus : seulement des adresses http ou https. Événements : titre et date, en texte.

  async function onCut(m) {

  // La personne a supprimé son identité en gardant ses contacts : le lien reste en pause.
  async function onPause(m) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    let p;
    try { p = await decryptFrom(await sharedKey(c.raw), m.iv, m.ct); } catch (e) { return false; }
    if (c.rts && Number(p.ts) <= c.rts) return false;
    const all = contacts(); const x = all.find((y) => y.cid === c.cid);
    x.pause = { since: Date.now() }; x.rts = Number(p.ts) || Date.now();
    LS.set('contacts', all);
    S.flash = { t: (x.name || x.pseudo) + ' a supprimé son identité. Le lien reste en pause pendant 7 jours.' };
    return true;
  }
  // Reprise : la personne a installé ses contacts avec sa nouvelle identité. Le lien repart, sans nouveau QR code.
  async function onReprise(m) {
    // Reprise : seulement si le serveur a vérifié l’expéditeur, que c’est bien celui du message, et que la clé du lien est juste.
    if (m.auth !== true || typeof m.old !== 'string' || typeof m.from !== 'string') return false;
    const c = contacts().find((x) => x.raw === m.old || x.prev === m.old);
    if (!c) return false;
    let p;
    try { p = await decryptFrom(await sharedKey(m.old), m.iv, m.ct); } catch (e) { return false; }
    if (!p || typeof p.raw !== 'string' || p.raw.length < 40 || p.raw !== m.from) return false;
    if (c.prev === m.old) {
      // Ce lien a déjà été repris : le fichier ne sert plus. Seule la même nouvelle identité peut redemander, pour recevoir l’accusé.
      if (c.raw !== p.raw) return false;
      try { await sendAuth(c.raw, 'reprise-ok', { ts: Date.now() }); } catch (e) { /* renvoyé à la prochaine reprise */ }
      return true;
    }
    if (c.rts && Number(p.ts) <= c.rts) return false;
    // Rien ne bouge tout de suite : la personne compare les six mots avec celle qui reprend, puis confirme.
    LS.set('pending', pendingAll().filter((q) => !(q.type === 'reprise-verif' && q.cid === c.cid)));
    pushPending({ type: 'reprise-verif', cid: c.cid, peer: p.raw, oldRaw: m.old, pseudo: String(p.pseudo || ''), ts: Number(p.ts) || Date.now() });

  // Jauge du code secret et du code d’urgence, à la création : elle compte jusqu’au minimum, puis devient verte quand le code est valide.

  function majJauge(champ) {
    const j = document.querySelector('[data-jauge="' + champ.id + '"]');

    const v = champ.value || '';
    const n = v.length;
    const motif = n >= 8 ? erreurCodeSecret(v) : '';
    const valide = n >= 8 && !motif;
    const etat = valide ? 'ok' : n >= 8 ? 'attention' : 'on';
    j.querySelectorAll('.jauge-barre i').forEach((b, i) => { b.className = i < Math.min(n, 8) ? etat : ''; });
    j.classList.toggle('ok', valide);
    j.classList.toggle('attention', n >= 8 && !valide);
    j.querySelector('.jauge-texte').textContent = n === 0 ? 'Encore 8 caractères' : n < 8 ? 'Encore ' + (8 - n) + (8 - n > 1 ? ' caractères' : ' caractère') : valide ? 'Minimum atteint' : motif;

  // Œil « maintenir pour voir » : le texte s’affiche tant que le doigt (ou la touche) reste posé, puis redevient des points.

  function retardQR(d) { return -(((Date.now() / 1000) + d) % 3.2); }
  function qrDecorCells() {

  // QR code vivant de chaque contact : petit, décoratif, et toujours le même motif pour une même personne.
  // Chaque case vaut « F » (repère, toujours plein), « 1 » (case qui respire) ou « 0 » (vide).
  function qrMiniCells(cid) {
    const N = 21;
    let seed = 7;
    for (const ch of String(cid)) seed = (seed * 31 + ch.charCodeAt(0)) % 2147483647;
    if (!seed) seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const finder = (r, c, r0, c0) => { const i = r - r0, j = c - c0; return i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4); };
    let out = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const sep = (r === 7 && c <= 7) || (c === 7 && r <= 7) || (r === 7 && c >= 13) || (c === 13 && r <= 7) || (r === 13 && c <= 7) || (c === 7 && r >= 13);

  function qrGrille(key) {

    document.body.appendChild(a);

  // Noms des fiches d’un fichier .vcf : le fichier est lu sur cet appareil, rien n’est envoyé.
  function parseVcardNames(text) {
    const lignes = String(text || '').replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n');
    const val = (s) => s.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();
    const noms = [];
    let fn = '', nom = '';
    for (const ligne of lignes) {
      const i = ligne.indexOf(':');
      if (i < 0) continue;
      const cle = ligne.slice(0, i).split(';')[0].split('.').pop().toUpperCase();
      const v = ligne.slice(i + 1);
      if (cle === 'BEGIN') { fn = ''; nom = ''; }
      else if (cle === 'FN' && !fn) fn = val(v);
      else if (cle === 'N' && !nom) { const p = v.split(';'); nom = [p[1], p[0]].map((x) => val(x || '')).filter(Boolean).join(' '); }
      else if (cle === 'END') { const titre = (fn || nom).slice(0, 40); if (titre) noms.push(titre); fn = ''; nom = ''; }
    }
    return noms;
  }

  // ---------- sauvegarde chiffrée : le fichier reste entre vos mains ----------
  async function sealWithCode(code, obj) {
    const salt = rand(16), iv = rand(12);
    const kb = await pbkdf2(code, salt, ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj))));
    return JSON.stringify({ pli: 1, s: b64u(salt), i: b64u(iv), c: b64u(ct) }, null, 1);
  }
  async function openWithCode(code, text) {
    let box = null;
    try { box = JSON.parse(text); } catch (e) { box = null; }
    if (!box || box.pli !== 1 || !box.s || !box.i || !box.c) throw new Error('Ce fichier n’est pas une sauvegarde Pli Scellé.');
    const kb = await pbkdf2(code, unb64u(box.s), ITER_SECRET);
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    let pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(box.i) }, key, unb64u(box.c)); }
    catch (e) { throw new Error('Code secret incorrect, ou sauvegarde abîmée.'); }
    return JSON.parse(dec.decode(pt));
  }
  // Sauvegarde des contacts : pour chaque lien, l’adresse de la personne, l’ancienne adresse et la clé du lien. Jamais la clé de votre identité.
  async function backupPayload() {
    const liste = [];
    for (const c of contacts()) {
      const lien = c.pend ? { old: c.pend.old, lk: c.pend.lk } : { old: S.me.raw, lk: b64u(await sharedBits(c.raw)) };
      liste.push({ name: c.name, pseudo: c.pseudo || '', raw: c.raw, label: c.label, since: c.since, old: lien.old, lk: lien.lk });
    }
    // Identifiant de l’identité, pas du fichier : toutes ses sauvegardes le portent. Il est chiffré dans le fichier, jamais en clair.
    // Une seule installation par identifiant : une fois une sauvegarde installée, les autres sauvegardes de cette identité ne servent plus.
    let bid = LS.get('bid', null);
    if (!bid) { bid = b64u(rand(16)); LS.set('bid', bid); }
    return { v: 3, bid: bid, at: Date.now(), contacts: liste };
  }
  function validContacts(o) {
    return !!o && o.v === 3 && typeof o.bid === 'string' && o.bid.length >= 20 && Array.isArray(o.contacts) && o.contacts.every((c) => c && typeof c.raw === 'string' && typeof c.old === 'string' && typeof c.lk === 'string' && c.raw.length > 40 && c.old.length > 40 && c.lk.length > 20);
  }

  // ---------- affichage ----------
  function go(screen, arg) {
    cancelVoice();   // quitter l’écran arrête le micro et jette l’enregistrement en cours
    if (screen !== 'lien-coupe') S.cut = null;
    if (screen !== 'sauvegarde') { S.delMode = false; S.backupText = null; S.backupDone = false; S.backupMessage = null; }
    if (screen !== 'scanner') { S.scanKind = null; S.scanText = ''; S.scanLink = false; }
    S.screen = screen;
    S.arg = (arg == null ? null : arg);
    render();
  }
  // La zone de saisie grandit avec le texte, jusqu’à environ six lignes.
  function autoGrow() {
    const el = document.getElementById('draft');
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }
  // Dans la zone de saisie : le micro tant qu’il n’y a ni texte ni pièce jointe, puis le bouton d’envoi.
  function syncComposerAct() {
    const b = document.getElementById('composerAct');
    const d = document.getElementById('draft');
    if (!b || !d) return;
    const envoi = d.value.trim() !== '' || (S.attach || []).length > 0;
    b.dataset.act = envoi ? 'send' : 'voicerec';
    b.className = 'act-btn ' + (envoi ? 'act-send' : 'act-mic');
    b.innerHTML = envoi ? I.send : I.mic;
    b.setAttribute('aria-label', envoi ? 'Envoyer' : 'Message vocal');
  }
  function render() {
    if ((S.screen !== 'identite' || (S.effacement && S.effacement.cible !== idActif)) && (S.effacement || decompteTimer)) quitterEffacement();
    if (S.screen !== 'codeoublie-decompte') arreterDecompteOublie();
    expireOpened();
    chargerEmpreintes();
    const app = $('#app');
    const fn = VIEWS[S.screen] || VIEWS.boot;
    // Même écran et même contact : brouillon, lien en cours et focus survivent au redessin.
    const key = S.screen + ':' + (S.screen === 'creer' ? '' : S.arg);
    const same = app.dataset.view === key;
    if (!same) { S.attach = []; S.linkOpen = false; S.eventOpen = false; S.plusOpen = false; S.plusPanneau = null; S.plusMsg = ''; }
    const keep = {};
    if (same) ['draft', 'linkIn', 'fcode', 'qrtext', 'invlabel', 'v0', 'v1', 'v2', 'cname', 'pseudo', 's1', 's2', 'recherche'].forEach((id) => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
    const act = document.activeElement;
    const focusId = same && act && (act.id === 'draft' || act.id === 'linkIn' || act.id === 'recherche') ? act.id : null;
    let html;
    try { html = fn(); } catch (e) { console.error(e); html = '<div class="screen">' + notice('err', 'Affichage impossible : ' + esc(e.message)) + '</div>'; }
    const flash = S.flash ? notice(S.flash.ok ? 'ok' : 'info', esc(S.flash.t)) : '';
    S.flash = null; S.needRender = false;
    const hauteur = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const pres = hauteur + window.scrollY >= document.documentElement.scrollHeight - 160 || !!S.forceBas;   // en bas, ou message envoyé à l’instant
    S.forceBas = false;
    // Nouvelle version : le bandeau suit l’utilisateur sur tous les écrans, pas seulement sur l’accueil.
    const maj = versionNouvelle && S.screen !== 'accueil' ? '<div class="pending-stack"><button class="notice warn" data-act="recharger">' + I.refresh + '<span class="grow">Nouvelle version (' + esc(versionNouvelle) + ') disponible<br><span class="more">Touchez pour la charger. Vos données restent sur cet appareil.</span></span>' + I.chev + '</button></div>' : '';
    const defile = window.scrollY;
    // Coque de la conversation (barre et zone de saisie, sans le fil) : si elle n’a pas changé, seul le fil est remplacé.
    let coque = null, fil = null;
    if (S.screen === 'conv' && !flash && !maj) {
      const c = contacts().find((x) => x.cid === S.arg);
      if (c) { fil = convFilHTML(c); const i = html.indexOf(fil); if (i >= 0) coque = html.slice(0, i) + html.slice(i + fil.length); }
    }
    if (same && coque !== null && app.__coque === coque && app.querySelector('.thread')) {
      app.querySelector('.thread').innerHTML = fil.slice('<div class="thread">'.length, -'</div>'.length);
      hydrateVoices();
      autoGrow();
      syncComposerAct();
      if (pres) window.scrollTo(0, document.documentElement.scrollHeight); else window.scrollTo(0, defile);
      return;
    }
    app.__coque = coque;
    app.innerHTML = maj + flash + html;
    app.classList.toggle('meme-ecran', same);   // même écran redessiné : il ne rejoue pas son apparition
    hydrateVoices();
    Object.keys(keep).forEach((id) => { const el = document.getElementById(id); if (el) el.value = keep[id]; });
    majJauges();
    appliquerRecherche();
    if (S.screen === 'nouveau' && !same) { const r = document.getElementById('recherche'); if (r) r.focus({ preventScroll: true }); }
    autoGrow();          // la zone reprend la hauteur du brouillon restauré…
    syncComposerAct();   // …et le bon bouton : micro, ou envoi s’il y a du texte
    // Conversation : on s’ouvre sur le dernier message, et il suit les nouveaux si on était déjà en bas
    if (S.screen === 'conv' && (!same || pres)) window.scrollTo(0, document.documentElement.scrollHeight);
    else if (same) window.scrollTo(0, defile);   // même écran mis à jour : on garde la position de lecture
    app.dataset.view = key;
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  }
  // Message dans la vue en cours ; sans zone dédiée, il s’affiche en haut.

  async function copyText(text, okMsg) {

  // ---------- actions ----------
  // Code secret : au moins 8 caractères, lettres et chiffres mélangés, 32 au maximum.
  // Refusé : une suite ou une répétition de 4 caractères (1234, abcd, aaaa).
  function suiteOuRepetition(c) {
    const v = String(c).toLowerCase().split('').map((x) => x.charCodeAt(0));
    for (let i = 0; i + 3 < v.length; i++) {
      const a = v[i], b = v[i + 1], d = v[i + 2], e = v[i + 3];
      const monte = b === a + 1 && d === b + 1 && e === d + 1;
      const descend = b === a - 1 && d === b - 1 && e === d - 1;
      const meme = a === b && b === d && d === e;
      if (monte || descend || meme) return true;
    }
    return false;
  }
  function erreurCodeSecret(c) {
    if (c.length < 8) return 'Le code secret compte au moins 8 caractères.';
    if (c.length > 32) return 'Le code secret compte 32 caractères au maximum.';
    if (!/^[A-Za-z0-9]+$/.test(c)) return 'Le code secret ne contient que des lettres sans accent et des chiffres.';
    if (!/[A-Za-z]/.test(c) || !/[0-9]/.test(c)) return 'Mélangez des lettres et des chiffres.';
    if (suiteOuRepetition(c)) return 'Trop simple : 4 caractères qui se suivent ou se répètent.';
    return null;
  }
  async function actCreate() {
    const pseudo = ($('#pseudo').value || '').trim();
    const s1 = $('#s1').value, s2 = $('#s2').value;
    if (pseudo.length < 2 || pseudo.length > 24) return setStatus('formstatus', 'err', 'Le pseudo fait entre 2 et 24 caractères.');
    const erreur = erreurCodeSecret(s1);
    if (erreur) return setStatus('formstatus', 'err', erreur);
    if (!$('#averti') || !$('#averti').checked) return setStatus('formstatus', 'err', 'Cochez « J’ai compris » : c’est ce qui arrive après trois erreurs.');
    if (s1 !== s2) return setStatus('formstatus', 'err', 'Les deux codes secrets ne sont pas identiques.');

  // Supprime sur le relais les messages non téléchargés. Avec « seulementMessages », les autres (lien, reprise) restent.

      if (!rows || !rows.length) return;
      let retires = 0;
      for (const r of rows) {

        await rpc('pli_ack', { p_id: r.msg_id, p_mailbox: boite, p_secret: S.me.secret });

  async function wrapPkcs8(pkcs8, code) {

        g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);

    });

    if (!p || p.type !== 'verif' || !p.pos) return go('accueil');
    const touches = S.selMots && S.selMots.pid === pid ? S.selMots.idx.slice().sort((a, b) => a - b) : [];
    if (touches.length !== p.pos.length) return;
    const mots = await wordsFor(unb64u(S.me.raw), unb64u(p.peer));
    await sendAuth(p.peer, 'mots', { inv: p.invId, niveau: p.niveau || 1, mots: touches.map((k) => ({ p: k + 1, m: mots[k] })) });
    LS.set('pending', pendingAll().map((x) => x.pid === pid ? { pid: x.pid, at: Date.now(), type: 'remote-sent', peer: x.peer, peerPseudo: x.peerPseudo, invId: x.invId } : x));
    S.selMots = null; S.words = mots;
    go('attente');
  }
  // Les mots correspondent : le code part dans l’appli, chiffré pour cette seule personne.
  async function actEnvoyerCode(pid) {
    const name = nameValue();
    if (!name) return setStatus('formstatus', 'err', 'Donnez un nom à ce contact.');
    const p = pendingById(pid);
    if (!p || !p.ok) return go('lien-ouvert', pid);
    const inv = invitesAll().find((i) => i.id === p.invId);
    if (!inv) return go('accueil');
    await sendAuth(p.peer, 'code', { inv: p.invId, code: inv.code, salt: inv.salt });
    LS.set('pending', pendingAll().map((x) => x.pid === pid ? { pid: x.pid, at: Date.now(), type: 'code-envoye', peer: x.peer, peerPseudo: x.peerPseudo, invId: x.invId, name: name } : x));
    S.verifFait = false; S.verifOk = false;
    go('lien-ouvert', pid);
  }
  // La personne finit : elle prouve qu’elle a le code. Le code est déjà rempli, un seul geste.
  async function actFinirInvite(pid) {
    const p = pendingById(pid);
    if (!p || p.type !== 'code') return go('accueil');
    const words = await wordsFor(unb64u(S.me.raw), unb64u(p.peer));
    const K = await pbkdf2(p.code, unb64u(p.salt), ITER_CODE);
    const proof = await proofFor(K, S.me.raw);
    await sendTo(p.peer, { kind: 'proof', inv: p.invId, proof: proof });
    // Pendant l’envoi, l’acceptation peut déjà être arrivée : la demande n’est plus en « code », on ne revient pas en arrière.
    if ((pendingById(pid) || {}).type === 'code') {
      LS.set('pending', pendingAll().map((x) => x.pid === pid ? { pid: x.pid, at: Date.now(), type: 'remote-sent', peer: x.peer, peerPseudo: x.peerPseudo, invId: x.invId, confirme: true, fini: true } : x));
    }
    S.words = words;
    // Rien d’asynchrone entre ces lignes : l’écran affiché correspond à l’état réel de la demande.
    if ((pendingById(pid) || {}).type === 'remote-accepted') { S.routed.add(pid); return go('nommer', pid); }
    go('attente');
  }
  // Annulation par la personne qui invite : l’invitée voit « La personne a annulé la demande ».
  async function actRefuseRemote(pid) {
    const p = pendingById(pid);
    const why = 'cancelled';
    if (p) { try { await sendTo(p.peer, { kind: 'refuse', inv: p.invId, why: why }); } catch (e) {} }
    dropPending(pid);
    S.verifFait = false; S.verifOk = false;
    go('accueil');
  }
  async function actConfirmRemote(pid) {
    const name = nameValue();
    if (!name) return setStatus('formstatus', 'err', 'Donnez un nom à ce contact.');
    const p = pendingById(pid);
    if (!p) return go('accueil');
    const avant = contacts().find((x) => x.raw === p.peer);
    const c = addContact(p.peer, p.peerPseudo, name);
    if (avant) S.flash = { t: messageDejaLa(avant.name, name), ok: true };
    dropPending(pid);
    go('contact', c.cid);
  }
  async function actSend(cid) {
    const lien = contacts().find((x) => x.cid === cid);
    if (lien && (lien.pause || lien.pend)) return flashNow({ t: 'Le lien n’est pas actif : écrire est impossible pour l’instant.' });
    if (S.envoiEnCours) return;
    const inp = $('#draft');
    const text = (inp.value || '').trim();
    const pieces = S.attach || [];
    const liens = pieces.filter((a) => a.kind === 'link').map((a) => a.url);
    const evenements = pieces.filter((a) => a.kind === 'event').map((a) => ({ titre: a.titre || '', quand: a.quand || '' }));
    const fichiers = pieces.filter((a) => (a.kind === 'photo' || a.kind === 'document') && a.file);
    if (!text && !liens.length && !evenements.length && !fichiers.length) return;
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return go('accueil');
    S.envoiEnCours = true;
    try {
      const key = await sharedKey(c.raw);
      if (fichiers.length) { S.envoiProg = 'Préparation de l’envoi…'; renderAttach(); }
      // Les fichiers partent d’abord, un par un. Chaque fichier parti sort de la zone de saisie : une coupure ne le renvoie pas en double.
      for (const p of fichiers) {
        const envoi = await envoyerFichier(c, p, key);
        const nom = p.file.name.slice(0, 120);
        const type = (p.file.type || '').slice(0, 100);
        const meta = await encryptFor(key, { id: envoi.id, nom: nom, type: type, taille: p.file.size, total: envoi.total, genre: p.kind, apercu: p.kind === 'photo' && p.apercu === true, ts: envoi.debut });
        await S.db.collection('box').add({ to: await mailboxOf(c.raw), from: S.me.raw, kind: 'fichier', ts: Date.now(), iv: meta.iv, ct: meta.ct });
        const all = msgsAll();
        all.push({ mid: rid(10), cid: cid, dir: 'out', kind: 'fichier', fichier: { nom: nom, type: type, taille: p.file.size, genre: p.kind, apercu: p.kind === 'photo' && p.apercu === true }, state: 'sent', ts: Date.now(), once: false });
        LS.set('msgs', all);
        S.attach = (S.attach || []).filter((a) => a !== p);
        S.envoiProg = '';
        renderAttach();
      }
      if (text || liens.length || evenements.length) {
        const body = await encryptFor(key, { t: text, ts: Date.now(), once: S.once !== false, liens: liens, evenements: evenements });
        await S.db.collection('box').add({ to: await mailboxOf(c.raw), from: S.me.raw, kind: 'msg', ts: Date.now(), iv: body.iv, ct: body.ct });
        const all = msgsAll();
        all.push({ mid: rid(10), cid: cid, dir: 'out', state: 'sent', ts: Date.now(), once: S.once !== false });
        LS.set('msgs', all);
      }
    } catch (e) {
      S.envoiEnCours = false;
      S.envoiProg = '';
      renderAttach();
      return flashNow({ t: 'Envoi impossible. Vérifiez la connexion, puis réessayez.', ok: false });
    }
    S.envoiEnCours = false;
    S.envoiProg = '';
    S.attach = [];
    S.forceBas = true;
    marqueConversation(cid, Date.now());
    inp.value = '';
    go('conv', cid);
  }
  // ---------- photos et documents : chiffrés, envoyés par morceaux, effacés après téléchargement ----------
  // Chaque morceau est chiffré avec la clé du lien (AES-GCM, IV de 12 octets en tête) : le relais ne voit que du chiffré.
  async function chiffrerOctets(key, octets) {
    const iv = rand(12);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, octets));
    const tout = new Uint8Array(iv.length + ct.length);
    tout.set(iv, 0);
    tout.set(ct, iv.length);
    return b64u(tout);
  }
  async function dechiffrerOctets(key, data) {
    const tout = unb64u(data);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: tout.slice(0, 12) }, key, tout.slice(12)));
  }
  // Quatre morceaux à la fois, comme pour le vocal. Un échec arrête les autres.
  async function parQuatre(n, tache) {
    const suivant = { i: 0 };
    let echec = false;
    const travail = async () => {
      while (!echec && suivant.i < n) {
        const i = suivant.i++;
        try { await tache(i); } catch (e) { echec = true; throw e; }
      }
    };
    await Promise.all([travail(), travail(), travail(), travail()]);
  }
  function tailleFichier(o) {
    const n = Number(o) || 0;
    return n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' Ko' : (n / (1024 * 1024)).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' Mo';
  }
  // Envoi d’un fichier : chaque morceau part chiffré. Le message qui l’annonce ne part qu’une fois tous les morceaux arrivés.
  async function envoyerFichier(c, piece, key) {
    const f = piece.file;
    const id = rid(24);
    const total = Math.max(1, Math.ceil(f.size / FICHIER_MORCEAU));
    const destinataire = await mailboxOf(c.raw);
    const debut = Date.now();
    let envoyes = 0;
    await parQuatre(total, async (i) => {
      const octets = new Uint8Array(await f.slice(i * FICHIER_MORCEAU, (i + 1) * FICHIER_MORCEAU).arrayBuffer());
      const data = await chiffrerOctets(key, octets);
      await rpc('pli_piece_put', { p_from: S.me.raw, p_secret: S.me.secret, p_destinataire: destinataire, p_id: id, p_idx: i, p_total: total, p_data: data });
      envoyes++;
      S.envoiProg = 'Envoi de « ' + f.name + ' » : ' + envoyes + ' / ' + total;
      const el = document.getElementById('fenvoi');
      if (el) el.textContent = S.envoiProg;
    });
    return { id: id, total: total, debut: debut };
  }
  // Photo ou document reçu : seule l’annonce est gardée ; le contenu reste sur le relais jusqu’au téléchargement.
  async function onFichier(m, docId) {
    const c = contacts().find((x) => x.raw === m.from);
    if (!c) return false;
    const key = await sharedKey(c.raw);
    const body = await decryptFrom(key, m.iv, m.ct);
    const genre = body.genre === 'document' ? 'document' : 'photo';
    const max = genre === 'photo' ? FICHIER_PHOTO_MAX : FICHIER_DOC_MAX;
    const id = String(body.id || '');
    const total = Number(body.total);
    const taille = Number(body.taille);
    if (id.length < 16 || id.length > 64 || !(total >= 1 && total <= 400) || !(taille >= 0 && taille <= max)) return false;
    const all = msgsAll();
    all.push({ mid: docId, cid: c.cid, dir: 'in', kind: 'fichier', fichier: { id: id, nom: String(body.nom || 'fichier').slice(0, 120), type: String(body.type || '').slice(0, 100), taille: taille, total: total, genre: genre, apercu: genre === 'photo' && body.apercu === true }, state: 'new', ts: body.ts || Date.now(), once: false });
    LS.set('msgs', all);
    marqueConversation(c.cid, body.ts || Date.now());
    return true;
  }
  // Tuile d’un fichier : la consigne reste jusqu’au téléchargement ; ensuite la tuile dit qu’il a été effacé.
  function msgFichierHTML(m) {
    const f = m.fichier || {};
    const doc = f.genre === 'document';
    const ico = '<span class="fichier-ico" aria-hidden="true">' + I.file + '</span>';
    const detail = '<span class="fichier-ligne"><span class="fichier-nom">' + esc(f.nom || '') + '</span><span class="fichier-taille"> · ' + tailleFichier(f.taille) + '</span></span>';
    if (m.dir === 'out') return '<div class="tile mine">' + ico + '<span class="tt"><b>' + (doc ? 'Document envoyé' : 'Photo envoyée') + '</b><span class="hint">' + detail + (f.apercu ? ' · aperçu seulement, effacée à l’ouverture' : ' · téléchargé une fois, puis effacé') + '</span></span></div>';
    if (m.state === 'new' && f.apercu) return '<button class="tile unread" data-act="voirfichier" data-arg="' + esc(m.mid) + '">' + ico + '<span class="tt"><b>Photo reçue</b><span class="hint">' + detail + '</span><span class="hint">Aperçu seulement : vous pouvez la voir, pas la télécharger.</span><span class="fichier-action" id="fp-' + esc(m.mid) + '">' + (S.apercuEnCours === m.mid ? 'Ouverture…' : 'Voir l’aperçu') + '</span><span class="nouveau">Nouveau</span></span></button>';
    if (m.state === 'new') return '<button class="tile unread" data-act="telechargerfichier" data-arg="' + esc(m.mid) + '">' + ico + '<span class="tt"><b>' + (doc ? 'Document reçu' : 'Photo reçue') + '</b><span class="hint">' + detail + '</span><span class="hint">Téléchargez le fichier : il sera supprimé juste après.</span><span class="fichier-action" id="fp-' + esc(m.mid) + '">' + (S.telechargement === m.mid ? 'Téléchargement…' : 'Télécharger') + '</span><span class="nouveau">Nouveau</span></span></button>';
    if (m.expire) return '<div class="tile read">' + ico + '<span class="tt"><b>' + (doc ? 'Document expiré' : 'Photo expirée') + '</b><span class="hint">Non téléchargé dans les 48 heures : il a été effacé</span></span></div>';
    if (m.vu) return '<div class="tile read">' + ico + '<span class="tt"><b>Photo vue</b><span class="hint">Aperçu terminé : elle a été effacée du relais</span></span></div>';
    return '<div class="tile read">' + ico + '<span class="tt"><b>' + (doc ? 'Document téléchargé' : 'Photo téléchargée') + '</b><span class="hint">Effacé du relais après le téléchargement</span></span></div>';
  }
  // Téléchargement : les morceaux sont déchiffrés sur ce téléphone, le fichier est enregistré, puis effacé du relais.
  async function actTelechargerFichier(mid) {
    if (S.telechargement) return;
    const m = msgsAll().find((x) => x.mid === mid);
    if (!m || m.kind !== 'fichier' || m.dir !== 'in' || m.state !== 'new' || !m.fichier) return;
    const c = contacts().find((x) => x.cid === m.cid);
    if (!c) return;
    const marquer = (fn) => { const frais = msgsAll(); const x = frais.find((y) => y.mid === mid); if (x) { fn(x); LS.set('msgs', frais); } };
    if (Date.now() - (m.ts || 0) > FICHIER_DUREE_MS) { marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); x.expire = true; }); return render(); }
    const f = m.fichier;
    S.telechargement = mid;
    const afficher = (n) => { const el = document.getElementById('fp-' + mid); if (el) el.textContent = 'Téléchargement : ' + n + ' / ' + f.total; };
    afficher(0);
    try {
      const key = await sharedKey(c.raw);
      const moi = await mailboxOf(S.me.raw);
      const morceaux = new Array(f.total);
      let lus = 0;
      await parQuatre(f.total, async (i) => {
        const rows = await rpc('pli_piece_get', { p_mailbox: moi, p_secret: S.me.secret, p_id: f.id, p_idx: i });
        const ligne = Array.isArray(rows) ? rows[0] : null;
        if (!ligne) throw new Error('introuvable');
        morceaux[i] = await dechiffrerOctets(key, ligne.out_data);
        lus++;
        afficher(lus);
      });
      enregistrerFichier(new Blob(morceaux, { type: f.type || 'application/octet-stream' }), f.nom);
      let efface = true;
      try { await rpc('pli_piece_delete', { p_mailbox: moi, p_secret: S.me.secret, p_id: f.id }); } catch (e) { efface = false; }
      if (!efface) LS.set('fichiersAEffacer', LS.get('fichiersAEffacer', []).concat([f.id]));
      marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); });
    } catch (e) {
      if (e && e.message === 'introuvable') {
        marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); x.expire = true; });
        flashNow({ t: 'Ce fichier n’est plus sur le relais : il a expiré.', ok: false });
      } else {
        flashNow({ t: 'Téléchargement impossible. Vérifiez la connexion, puis réessayez.', ok: false });
      }
    } finally {
      S.telechargement = null;
      render();
    }
  }
  // Morceaux déchiffrés et réassemblés, sans rien enregistrer : sert à l’aperçu.
  async function recupererFichier(m, c) {
    const f = m.fichier;
    const key = await sharedKey(c.raw);
    const moi = await mailboxOf(S.me.raw);
    const morceaux = new Array(f.total);
    await parQuatre(f.total, async (i) => {
      const rows = await rpc('pli_piece_get', { p_mailbox: moi, p_secret: S.me.secret, p_id: f.id, p_idx: i });
      const ligne = Array.isArray(rows) ? rows[0] : null;
      if (!ligne) throw new Error('introuvable');
      morceaux[i] = await dechiffrerOctets(key, ligne.out_data);
    });
    return new Blob(morceaux, { type: f.type || 'image/jpeg' });
  }
  // Aperçu seulement : la photo s’affiche dans une fenêtre, sans lien de téléchargement. À la fermeture, elle est effacée du relais.
  async function actVoirFichier(mid) {
    if (S.telechargement || S.apercuEnCours) return;
    const m = msgsAll().find((x) => x.mid === mid);
    if (!m || m.kind !== 'fichier' || m.dir !== 'in' || m.state !== 'new' || !m.fichier || !m.fichier.apercu) return;
    const c = contacts().find((x) => x.cid === m.cid);
    if (!c) return;
    const marquer = (fn) => { const frais = msgsAll(); const x = frais.find((y) => y.mid === mid); if (x) { fn(x); LS.set('msgs', frais); } };
    if (Date.now() - (m.ts || 0) > FICHIER_DUREE_MS) { marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); x.expire = true; }); return render(); }
    const f = m.fichier;
    S.apercuEnCours = mid;
    const bouton = document.getElementById('fp-' + mid);
    if (bouton) bouton.textContent = 'Ouverture…';
    let url = null;
    try {
      url = URL.createObjectURL(await recupererFichier(m, c));
    } catch (e) {
      S.apercuEnCours = null;
      if (e && e.message === 'introuvable') {
        marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); x.expire = true; });
        flashNow({ t: 'Ce fichier n’est plus sur le relais : il a expiré.', ok: false });
      } else {
        flashNow({ t: 'Ouverture impossible. Vérifiez la connexion, puis réessayez.', ok: false });
      }
      return render();
    }
    S.apercuEnCours = null;
    if (bouton) bouton.textContent = 'Voir l’aperçu';
    const fond = document.createElement('div');
    fond.id = 'apercu-fichier';
    fond.className = 'apercu-fond';
    fond.innerHTML = '<img class="apercu-img" alt="' + esc(f.nom) + '" draggable="false" src="' + esc(url) + '"><p class="apercu-note">Aperçu seulement : cette photo ne se télécharge pas. Elle sera effacée à la fermeture.</p><button type="button" class="btn btn-primary apercu-fermer">Fermer</button>';
    fond.addEventListener('contextmenu', (e) => e.preventDefault());
    fond.querySelector('.apercu-fermer').addEventListener('click', async () => {
      fond.remove();
      URL.revokeObjectURL(url);
      let efface = true;
      try { const moi = await mailboxOf(S.me.raw); await rpc('pli_piece_delete', { p_mailbox: moi, p_secret: S.me.secret, p_id: f.id }); } catch (e) { efface = false; }
      if (!efface) LS.set('fichiersAEffacer', LS.get('fichiersAEffacer', []).concat([f.id]));
      marquer((x) => { x.state = 'gone'; x.goneAt = Date.now(); x.vu = true; });
      render();
    });
    document.body.appendChild(fond);
  }
  // Enregistre le fichier sur le téléphone : le navigateur le range dans ses téléchargements.
  function enregistrerFichier(blob, nom) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = String(nom || 'fichier').replace(/[\\\/:*?"<>|]/g, '') || 'fichier';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  // Effacement du relais après un téléchargement : repris au tour suivant si le réseau a coupé.
  async function reessaieEffacements() {
    const liste = LS.get('fichiersAEffacer', []);
    if (!liste.length || !S.me || !S.priv) return;
    const moi = await mailboxOf(S.me.raw);
    const faits = [];
    for (const id of liste) {
      try { await rpc('pli_piece_delete', { p_mailbox: moi, p_secret: S.me.secret, p_id: id }); faits.push(id); } catch (e) { /* on réessaie au prochain tour */ }
    }
    if (faits.length) LS.set('fichiersAEffacer', LS.get('fichiersAEffacer', []).filter((x) => faits.indexOf(x) < 0));
  }
  // Toucher un message ouvert le referme tout de suite : en lecture unique il est effacé, en relisible il redevient une tuile.
  function actFermerMessage(mid) {
    const all = msgsAll();
    const m = all.find((x) => x.mid === mid);
    if (!m || m.state !== 'open' || m.kind === 'voice') return;
    if (m.once === false) { m.state = 'new'; m.until = 0; }
    else { m.state = 'gone'; m.goneAt = Date.now(); m.text = ''; }
    LS.set('msgs', all);
    go('conv', S.arg);
  }
  function actReveal(mid) {
    const all = msgsAll();
    const m = all.find((x) => x.mid === mid);
    if (m && m.state === 'new') { m.state = 'open'; m.seen = true; m.until = Date.now() + dureeLecture(m.cid); LS.set('msgs', all); }
    go('conv', S.arg);
  }
  async function actCut(cid) {
    const c = contacts().find((x) => x.cid === cid);
    if (!c) return go('accueil');
    try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) {}
    removeContact(cid);
    S.cut = { name: c.name || c.pseudo };   // le nom donné à ce contact, pas son pseudo
    go('lien-coupe');
  }
  // Supprimer l’identité : avec « keep », les contacts sont mis en pause (ils pourront reprendre le lien) ; sinon, les liens sont coupés.
  // Efface l’identité. Avec « keep », les contacts sont mis en pause ; sinon ils reçoivent une coupure vérifiée par le serveur.
  // Renvoie false si un contact n’a pas pu être prévenu : rien n’est effacé, sauf si on force (code d’urgence).
  // Efface l’identité ouverte, et elle seule. « keep » garde les contacts en pause ; sinon ils reçoivent la coupure.
  async function effacerIdentite(keep, forcer) {
    if (keep === true) {
      for (const c of contacts()) { try { await sendAuth(c.raw, 'pause', { ts: Date.now() }); } catch (e) {} }
    } else {
      const echecs = [];
      for (const c of contacts()) { try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) { echecs.push(c.name || c.pseudo || 'un contact'); } }
      if (echecs.length && !forcer) { S.flash = { t: 'Rien n’a été effacé : impossible de prévenir ' + echecs.join(', ') + '. Réessayez en ligne.', ok: false }; return false; }
    }
    try { await purgerRelais(false); } catch (e) { /* hors ligne */ }
    for (const i of invitesAll()) { if (i.status === 'open') await closeInviteDoc(i.id); }
    stopPolling(); await attendreFinSynchro();   // la lecture en cours finit avant que les données ne soient effacées
    effacerDonneesIdentite(idActif);
    S.me = null; S.priv = null; S.qr = null; S.invQR = null; S.draftPseudo = null; S.words = null;
    stopPolling();
    return true;
  }
  // Supprime tout ce qui appartient à une identité : réglages, contacts, messages, base vocale.
  // Le compteur d’erreurs est commun à l’appareil : il ne disparaît qu’avec la dernière identité.
  function effacerDonneesIdentite(id) {
    Object.keys(localStorage).filter((k) => k.indexOf('pli.' + id + '.') === 0).forEach((k) => localStorage.removeItem(k));
    try { indexedDB.deleteDatabase(nomVoix(id)); } catch (e) { /* rien à effacer */ }
    vdbP = null;
    const restantes = IDENTITES.filter(presente);
    if (restantes.length) LSG.set('ids', restantes);
    else { localStorage.removeItem('pli.verrou'); localStorage.removeItem('pli.ids'); }
  }
  // Code oublié : toutes les identités de l’appareil sont effacées. Avant, on vérifie que tous les contacts seront prévenus :
  // si l’un d’eux ne peut pas l’être, rien n’est effacé.
  async function effacerTout() {
    const ids = IDENTITES.filter(presente);
    const avant = S.me, ouverte = idActif;
    for (const id of ids) {
      idActif = id; S.me = LS.get('me', null);
      const echecs = [];
      for (const c of contacts()) { try { await envoyerSigne(c.raw, { kind: 'cut' }); } catch (e) { echecs.push(c.name || c.pseudo || 'un contact'); } }
      if (echecs.length) {
        idActif = ouverte; S.me = avant;
        S.flash = { t: 'Rien n’a été effacé : impossible de prévenir ' + echecs.join(', ') + '. Réessayez en ligne.', ok: false };
        return false;
      }
    }
    for (const id of ids) {
      idActif = id; S.me = LS.get('me', null);
      try { await purgerRelais(false); } catch (e) { /* hors ligne */ }
      for (const i of invitesAll()) { if (i.status === 'open') await closeInviteDoc(i.id); }
      effacerDonneesIdentite(id);
    }
    idActif = 'a'; S.me = null; S.priv = null; S.autre = null; S.qr = null; S.invQR = null; S.draftPseudo = null; S.words = null;
    stopPolling();
    return true;
  }
  async function actDeleteMe(keep) {
    if (idActif === 'b') return actEffacerCetteIdentite();   // « mon identité » désigne l’agent double : lui seul est effacé
    if (idActif !== 'a') return;   // la suppression vise toujours la première identité
    if (await effacerIdentite(keep) === false) return go('identite');
    // La seconde est reliée à la première : elle est effacée avec elle.
    if (presente('b')) await effacerSeconde();
    S.autre = null;
    idActif = 'a';
    go(presente('a') ? 'verrouille' : 'creer');

  async function actMakeBackup() {
    const code = $('#bcode').value || '';
    if (!code) return setStatus('formstatus', 'err', 'Entrez votre code secret.');
    try { await unwrapPriv(S.me.wrap, code); } catch (e) { return setStatus('formstatus', 'err', 'Code secret incorrect.'); }
    if (!acheterOptionAppareil('sauvegarde')) return setStatus('formstatus', 'err', 'Il vous faut ' + libMonnaie(COUTS.sauvegarde) + ' pour sauvegarder vos contacts. Votre solde : ' + libMonnaie(soldeMonnaie()) + '.');
    const text = await sealWithCode(code, await backupPayload());
    if (S.downloads) {
      try {
        await S.downloads.save({ filename: 'pli-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', data: enc.encode(text) });
        LS.set('lastBackup', Date.now()); S.backupText = null; S.backupDone = true;
        go('sauvegarde');
        return flashNow({ t: 'Sauvegarde enregistrée. Gardez ce fichier en lieu sûr.', ok: true });
      } catch (e) {
        if (e && e.code === 'declined') return setStatus('formstatus', 'info', 'Enregistrement annulé.');
      }
    }
    // Le fichier est prêt : l’écran propose ensuite de l’enregistrer. Rien n’est marqué comme fait ici.
    S.backupText = text; S.backupDone = false; S.backupMessage = null;
    go('sauvegarde');
  }
  // Enregistrer le fichier : le menu de partage propose « Enregistrer dans Fichiers ». Rien n’est marqué sans enregistrement réel.
  async function actEnregistrerFichier() {
    if (!S.backupText) return;
    const nom = 'pli-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      if (S.downloads) {
        await S.downloads.save({ filename: nom, data: enc.encode(S.backupText) });
      } else {
        const fichier = new File([enc.encode(S.backupText)], nom, { type: 'application/json' });
        if (!(navigator.share && navigator.canShare && navigator.canShare({ files: [fichier] }))) {
          S.backupMessage = { kind: 'info', text: 'Ce téléphone ne permet pas d’enregistrer le fichier ici. Utilisez « Je n’arrive pas à enregistrer le fichier ».' };
          return go('sauvegarde');
        }
        await navigator.share({ files: [fichier], title: 'Sauvegarde Pli Scellé' });
      }
      LS.set('lastBackup', Date.now()); S.backupDone = true;
      S.backupText = null;   // le fichier est enregistré : plus de « Fichier prêt », plus de bouton « Enregistrer »
      S.backupMessage = { kind: 'ok', text: 'Fichier enregistré dans vos fichiers. Il est prêt à être utilisé.' };
    } catch (e) {
      const annule = e && (e.name === 'AbortError' || e.code === 'declined');
      S.backupMessage = { kind: 'info', text: annule ? 'Enregistrement annulé. Vous pouvez aussi copier le texte.' : 'Le fichier n’a pas pu être enregistré. Vous pouvez copier le texte.' };
    }
    go('sauvegarde');
  }
  // Installer la sauvegarde des contacts : ils apparaissent « À réactiver » jusqu’à la réponse de chaque personne.
  async function actInstall() {
    const code = $('#rcode').value || '';
    const text = ($('#rtext').value || '').trim();
    if (!text) return setStatus('formstatus', 'err', 'Choisissez le fichier de sauvegarde.');
    if (!code) return setStatus('formstatus', 'err', 'Entrez le code secret de la sauvegarde.');
    let o;
    try { o = await openWithCode(code, text); } catch (e) { return setStatus('formstatus', 'err', e.message); }
    if (!validContacts(o)) return setStatus('formstatus', 'err', 'Cette sauvegarde ne peut pas être installée. Refaites-la avec la version actuelle de l’appli.');
    // Une sauvegarde ne s’installe qu’une fois, sur n’importe quel appareil : la première installation la réserve, la suivante est refusée.
    const empreinte = hex(await sha(enc.encode('pli-sauvegarde|' + o.bid)));
    let libre = false;
    try { libre = (await rpc('pli_claim_backup', { p_h: empreinte })) === true; }
    catch (e) { return setStatus('formstatus', 'err', 'Impossible de vérifier la sauvegarde pour l’instant. Rien n’a été installé : réessayez en ligne.'); }
    if (!libre) return setStatus('formstatus', 'err', 'Ce fichier a déjà été utilisé. Il n’est plus valable.');
    let n = 0;
    for (const item of o.contacts) {
      if (contacts().some((c) => c.raw === item.raw)) continue;
      const c = addContact(item.raw, String(item.pseudo || ''), String(item.name || item.pseudo || 'Contact').slice(0, 40));
      const all = contacts(); const x = all.find((y) => y.cid === c.cid);
      if (x) x.pend = { old: item.old, lk: item.lk };
      LS.set('contacts', all);
      n++;
    }
    S.flash = { t: (n ? (n + (n > 1 ? ' contacts installés' : ' contact installé') + '. Touchez « Réactiver les liens » dans l’accueil.') : 'Ces contacts sont déjà dans votre liste.') + ' Ce fichier n’est plus utilisable : vous pouvez le supprimer.', ok: true };
    go('accueil');
  }
  // Envoie la demande de reprise à chaque contact en attente. Le lien revient quand la personne répond.
  async function actReactivate() {
    let envoyes = 0;
    for (const c of contacts().filter((x) => x.pend)) {
      try {
        await sendReprise(c);
        // La demande est partie : la personne confirme dans son appli.
        const all = contacts(); const x = all.find((y) => y.cid === c.cid);
        if (x && x.pend) { x.pend.envoyee = Date.now(); delete x.pend.refus; LS.set('contacts', all); }
        envoyes++;
      } catch (e) { /* réessayé au prochain appui */ }
    }
    render();
    flashNow({ t: envoyes ? 'Demande envoyée. Chaque lien revient quand la personne a confirmé dans son appli.' : 'Envoi impossible pour l’instant. Réessayez.', ok: envoyes > 0 });
  }

  // Sur l’agent double, ces actions s’affichent mais n’ont aucun effet : rien n’est activé, rien n’est sauvegardé, rien ne sort du téléphone.

  function tick() {
    const cd = document.getElementById('cd');
    const d = LS.get('display', null);
    if (cd && d) {
      const s = Math.max(0, Math.round((d.exp - Date.now()) / 1000));

  // ---------- alertes : sonnerie à la réception (facultative, réglée dans « Mon identité ») ----------
  function getPrefs() { const p = LS.get('prefs', null) || {}; return { sound: !!p.sound, tone: (p.tone && TONES[p.tone]) ? p.tone : 'pli', notif: !!p.notif, push: !!p.push }; }
  function setPref(k, v) { LS.set('prefs', Object.assign(getPrefs(), { [k]: v })); }
  // Son : un seul contexte audio à la fois (iOS en limite le nombre). Un contexte fermé ne reprend jamais : alors on en crée un autre.
  // iOS le suspend hors d’un toucher : on le reprend à chaque toucher, ce qui est le seul moment où il accepte le son.
  let ctxSon = null;
  function sonContexte() {
    if (ctxSon && ctxSon.state === 'closed') ctxSon = null;
    if (!ctxSon) { try { ctxSon = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxSon = null; } }
    return ctxSon;
  }
  function sonPret() { const c = sonContexte(); return !!c && c.state === 'running'; }
  function touchSon() {
    const c = sonContexte();
    if (!c || c.state === 'running') return;
    try {
      c.resume().then(() => { if (S.screen === 'accueil') S.needRender = true; }).catch(() => {});
      const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
    } catch (e) { /* son indisponible sur ce téléphone */ }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, touchSon));
  // Sonneries au choix : suites de notes générées sur place, sans fichier.
  // « partiels » : harmoniques de chaque note, [multiple de la fréquence, niveau relatif, durée relative].
  // « Pli » est la sonnerie de l’appli : deux notes claires, avec une touche aiguë qui rappelle le papier plié.

      fermerSeconde();
    }, true);
    document.addEventListener('click', (e) => {
      if (Date.now() > avalerClic) return;
      avalerClic = 0; e.stopPropagation(); e.preventDefault();
    }, true);
    if (!S.me) return go('creer', S.inviteId ? 'invite' : null);
    return go('verrouille', S.inviteId ? 'invite' : null);
  }
  init().catch((e) => { console.error(e); $('#app').innerHTML = '<div class="screen">' + notice('err', 'Erreur au démarrage : ' + esc(e.message)) + '</div>'; });
})();
</script>
<script>
// Le nom de la monnaie s’écrit en doré partout où il s’affiche (textes seulement).
(function () {
  const motif = /[Ss]ceaux?\b/;
  const coupe = /([Ss]ceaux?\b)/;
  function dorer(racine) {
    const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
    const noeuds = [];
    while (marcheur.nextNode()) {
      const n = marcheur.currentNode;
      if (motif.test(n.nodeValue) && !(n.parentElement && n.parentElement.closest('.monnaie, .mw, style, script, textarea'))) noeuds.push(n);
    }
    noeuds.forEach((n) => {
      // Le texte est rangé dans une enveloppe en ligne : dans une boîte flexible, le message reste d’un seul tenant.
      const enveloppe = document.createElement('span');
      enveloppe.className = 'mw';
      n.nodeValue.split(coupe).forEach((m, i) => {
        if (i % 2 === 1) {
          const s = document.createElement('span');
          s.className = 'monnaie';
          s.textContent = m;
          enveloppe.appendChild(s);
        } else if (m) {
          enveloppe.appendChild(document.createTextNode(m));
        }
      });
      n.parentNode.replaceChild(enveloppe, n);
    });
  }
  dorer(document.body);
  new MutationObserver(() => dorer(document.body)).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
